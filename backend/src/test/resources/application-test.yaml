spring:
  datasource:
    url: jdbc:h2:mem:chongchong-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  study-invite-secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

frontend:
  base-url: https://test.chongchong.app

auth:
  jwt:
    issuer: chongchong-test
    audience: chongchong-test-api
    secret-base64: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    access-token-validity: 30m
