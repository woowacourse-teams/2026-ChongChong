logging:
  level:
    org.springframework.test.context.cache: DEBUG
    org.testcontainers: INFO
    tc: INFO

spring:
  datasource:
    url: jdbc:h2:mem:chongchong-test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

aws:
  region: ap-northeast-2
  s3:
    bucket: test-upload-bucket
    upload-prefix: chongchong/files/test/uploads/
    url-validity: 3m

jwt:
  study-invite-secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

frontend:
  base-url: https://test.chongchong.app
  allowed-origins: https://test.chongchong.app,http://localhost:3005

web-push:
  notification:
    click-token-secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  vapid:
    public-key: BDcLQBzrmGYpdNmsaQrk9_uU9Q_wQb2ziEN5AIcoUq4bi2uKlC2UKcmfBuUdJj_NzcDu-ldeUpif_na9i-u3HKw
    private-key: 67yyNB109eqWbw7r3HcJCuwmLDaDROaI6DJH4nCWUYU
    subject: mailto:test@example.com

auth:
  jwt:
    issuer: chongchong-test
    audience: chongchong-test-api
    secret-base64: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    access-token-validity: 30m
  refresh-token:
    validity: 30d
  social:
    kakao:
      rest-api-key: test-kakao-rest-api-key
      client-secret: test-kakao-client-secret
      redirect-uri: http://localhost:3005/auth/kakao/callback
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      connect-timeout: 1s
      read-timeout: 1s
  web:
    refresh-cookie:
      name: refresh_token
      secure: true
      http-only: true
      same-site: Lax
      path: /api/auth
