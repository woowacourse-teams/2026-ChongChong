spring:
  datasource:
    url: jdbc:h2:mem:chongchong-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  study-invite-secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

frontend:
  base-url: https://test.chongchong.app

auth:
  jwt:
    issuer: chongchong-test
    audience: chongchong-test-api
    secret-base64: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    access-token-validity: 30m
  refresh-token:
    validity: 30d
  social:
    kakao:
      rest-api-key: test-kakao-rest-api-key
      client-secret: test-kakao-client-secret
      redirect-uri: http://localhost:3005/auth/kakao/callback
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      connect-timeout: 1s
      read-timeout: 1s
  web:
    refresh-cookie:
      name: refresh_token
      secure: true
      http-only: true
      same-site: Lax
      path: /auth
