plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'withoutc'
version = '0.0.1-SNAPSHOT'
description = 'chong-chong'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    def jjwtVersion = '0.13.0'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'com.atlassian.oai:openapi-request-validator-restassured:3.0.0'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'openapi-coverage'
    }
    systemProperty 'openapi.spec.path', layout.projectDirectory.file('docs/openapi/openapi.yaml').asFile.absolutePath
    systemProperty 'openapi.coverage.path', layout.buildDirectory.file('openapi/covered-operations.txt').get().asFile.absolutePath
    inputs.files(fileTree('docs/openapi') {
        include '**/*.yaml'
        exclude 'node_modules/**', 'dist/**'
    })
    outputs.file(layout.buildDirectory.file('openapi/covered-operations.txt'))
    doFirst {
        delete layout.buildDirectory.file('openapi/covered-operations.txt')
    }
    finalizedBy 'verifyOpenApiCoverage'
}

tasks.register('verifyOpenApiCoverage', Test) {
    description = 'Verifies that every OpenAPI operation has a successful HTTP test call.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'openapi-coverage'
    }
    systemProperty 'openapi.spec.path', layout.projectDirectory.file('docs/openapi/openapi.yaml').asFile.absolutePath
    systemProperty 'openapi.coverage.path', layout.buildDirectory.file('openapi/covered-operations.txt').get().asFile.absolutePath
    inputs.files(fileTree('docs/openapi') {
        include '**/*.yaml'
        exclude 'node_modules/**', 'dist/**'
    })
    inputs.file(layout.buildDirectory.file('openapi/covered-operations.txt'))
    shouldRunAfter tasks.named('test')
    onlyIf {
        tasks.named('test').get().filter.commandLineIncludePatterns.empty
    }
}
