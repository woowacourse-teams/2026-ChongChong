delete:
  tags: [Study Member]
  operationId: leave
  summary: 스터디 탈퇴
  description: 현재 멤버가 스터디에서 탈퇴한다. 경로 오류(400), 인증 실패(401), 접근 권한 없음 또는 리더의 탈퇴 시도(403)를 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '../../components/parameters.yaml#/StudyId' }]
  responses:
    '204': { description: 스터디 탈퇴 성공. 응답 본문 없음. }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/LeaveForbidden' }
