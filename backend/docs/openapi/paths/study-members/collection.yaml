get:
  tags: [Study Member]
  operationId: getAllStudyMembers
  x-backend:
    status: done
    owner: JYL35
    description: |
      스터디 구성원 목록을 조회한다. 멤버십 식별자, 이름, 프로필 이미지, 역할을 반환하며 리더를 우선 정렬한다.
  summary: 스터디 멤버 목록 조회
  description: 스터디 멤버 목록을 조회한다. 경로 오류(400), 인증 실패(401), 접근 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '../../components/parameters.yaml#/StudyId' }]
  responses:
    '200':
      description: 멤버 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/studies.yaml#/StudyMembersResponse' }
          example: { members: [{ id: 1, name: 홍길동, profileImage: 'https://example.com/profile.png', role: LEADER }] }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/StudyNotFound' }
