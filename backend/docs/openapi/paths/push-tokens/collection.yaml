post:
  tags: [Push Token]
  operationId: registerPushToken
  x-backend:
    status: done
    owner: wontop02
    description: |
      설치 ID는 전체 사용자에 걸쳐 유일하며, 등록·갱신을 원자적으로 처리한다. 재등록 시 사용자·토큰·플랫폼을 갱신하고 비활성 설치를 재활성화한다.
  summary: 푸시 토큰 등록
  description: 현재 사용자의 설치 단위 푸시 토큰을 등록하거나 갱신한다. 현재 서버는 EXPO 푸시 토큰만 지원한다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/push-tokens.yaml#/PushTokenCreateRequest' }
        example: { installationId: installation-1, token: 'ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]', platform: ANDROID }
  responses:
    '204': { description: 푸시 토큰 등록 성공. 응답 본문 없음. }
    '400': { $ref: '../../components/responses.yaml#/InvalidInputAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }
