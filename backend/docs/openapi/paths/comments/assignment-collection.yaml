parameters:
  - { $ref: '../../components/parameters.yaml#/StudyId' }
  - { $ref: '../../components/parameters.yaml#/AssignmentId' }
get:
  tags: [Comment]
  operationId: getAssignmentComments
  x-backend:
    status: todo
    owner: null
    description: 계약 선등록. 댓글 조회와 권한·커서·위치 조회 및 HTTP 인수 테스트는 구현 전이다.
  summary: 과제 댓글 목록 조회
  description: |
    현재 해당 스터디원은 제출 대상 여부와 관계없이 조회·작성할 수 있다. 과제 마감 후에도 작성할 수 있다.
    해당 원문의 댓글을 createdAt 오름차순, 같은 시각이면 ID 오름차순으로 반환한다.
    기본 10개, 최대 100개이며 수정해도 순서는 유지한다.
    cursor는 서버가 발급한 같은 원문의 문자열을 전달한다. cursor 댓글이 삭제돼도 다음 조회는 가능하다.
    focusCommentId를 지정하면 그 댓글을 포함하여 이후 size개를 반환한다.
    cursor와 focusCommentId 동시 지정은 400 COMMENT_INVALID_PAGE_REQUEST,
    잘못되거나 다른 원문의 cursor는 400 COMMENT_INVALID_CURSOR,
    삭제됐거나 다른 원문의 focus 댓글은 404 COMMENT_NOT_FOUND다.
    스터디 탈퇴·방출 또는 회원 탈퇴한 작성자는 탈퇴한 스터디원과 기본 이미지로 표시한다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/CommentCursor' }
    - { $ref: '../../components/parameters.yaml#/CommentFocusId' }
    - { $ref: '../../components/parameters.yaml#/Size' }
  responses:
    '200':
      description: 과제 댓글 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/comments.yaml#/CommentListResponse' }
          examples:
            leader:
              summary: 리더 본인의 댓글과 탈퇴한 작성자의 댓글
              value:
                comments:
                  - id: 41
                    author: { name: 바니, profileImageUrl: null, isDeparted: false }
                    createdAt: '2026-10-30T10:00:00.000000'
                    content: "일정 확인했습니다.\n다음 시간에 뵐게요."
                    isEdited: false
                    canEdit: true
                    canDelete: true
                  - id: 42
                    author: { name: 탈퇴한 스터디원, profileImageUrl: null, isDeparted: true }
                    createdAt: '2026-10-30T10:01:00.000000'
                    content: 감사합니다.
                    isEdited: true
                    canEdit: false
                    canDelete: true
                nextCursor: null
                hasNext: false
            empty:
              summary: 댓글 없음
              value: { comments: [], nextCursor: null, hasNext: false }
    '400': { $ref: '../../components/responses.yaml#/CommentListBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentCommentNotFound' }
post:
  tags: [Comment]
  operationId: createAssignmentComment
  x-backend:
    status: todo
    owner: null
    description: 계약 선등록. 댓글·알림·Delivery의 원자적 저장과 삭제 경합 처리는 구현 전이다.
  summary: 과제 댓글 작성
  description: |
    현재 해당 스터디원은 제출 대상 여부와 관계없이 조회·작성할 수 있다. 과제 마감 후에도 작성할 수 있다.
    content의 앞뒤 Unicode 공백을 제거한 뒤 1~1,000 코드 포인트로 검증한다.
    내부 공백·줄바꿈은 유지하며 작성자와 작성 시각은 서버가 결정한다. 답글·첨부는 지원하지 않는다.
    알림 후보는 등록 시점의 해당 스터디 모든 리더이며 이번 작성자 본인과 원문 조회 권한이 없는 사람을 제외하고 사용자별 한 번만 생성한다.
    기존 댓글 참여자라는 이유로 수신자를 추가하지 않는다.
    제목은 [{스터디 이름}] 새 댓글, 내용은 {작성자 이름} 스터디원이 댓글을 달았어요다.
    알림 deepLink는 원문 경로의 focusCommentId로 이 댓글을 가리킨다.
    댓글·앱 내 알림·활성 구독별 Delivery는 함께 커밋하며 Web Push는 커밋 후 기존 worker가 전달한다.
    잠금 후 미리 공유 잠그지 않은 새 수신 후보가 생기거나 알려진 잠금 경합으로 저장이 취소되면
    409 COMMENT_STATE_CHANGED이며 댓글·알림은 저장되지 않는다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/comments.yaml#/CommentWriteRequest' }
        example: { content: "  일정 확인했습니다.\n다음 시간에 뵐게요.  " }
  responses:
    '201':
      description: 과제 댓글 작성 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/comments.yaml#/CommentCreateResponse' }
          example: { commentId: 42 }
    '400': { $ref: '../../components/responses.yaml#/CommentWriteBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentCommentNotFound' }
    '409': { $ref: '../../components/responses.yaml#/CommentStateChanged' }
