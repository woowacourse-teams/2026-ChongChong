get:
  tags: [Notice]
  operationId: getMyReadStatus
  x-backend:
    status: done
    owner: frombunny
    description: |
      현재 사용자의 읽음 여부와 최초 읽은 시각을 조회한다.
      후속 예정: 권한 책임 분리(#256).
  summary: 내 공지 읽음 상태 조회
  description: 본인의 읽음 상태를 NOT_ASSIGNED, UNREAD, READ로 구분한다. 확인 대상이 아니어도 200 응답을 반환하며 읽음 시각이 없으면 readAt을 생략한다. 형식 오류(400), 인증 실패(401), 접근 권한 없음(403), 공지 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/StudyId' }
    - { $ref: '../../components/parameters.yaml#/NoticeId' }
  responses:
    '200':
      description: 내 읽음 상태 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/notices.yaml#/NoticeReadStatusResponse' }
          examples:
            read: { value: { readStatus: READ, readAt: '2026-08-27T10:30:00' } }
            unread: { value: { readStatus: UNREAD } }
            notAssigned: { value: { readStatus: NOT_ASSIGNED } }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/NoticeNotFound' }
