get:
  tags: [Notice]
  operationId: getAllReadStatuses
  x-backend:
    status: done
    owner: frombunny
    description: |
      리더가 읽음·미읽음 구성원과 대기 중인 리마인더 중 가장 이른 예약 시각을 조회한다.
      후속 예정: 공지·읽음 상태 책임 및 인가 규칙 분리(#256).
  summary: 공지 읽음 현황 조회
  description: 스터디 리더가 해당 공지의 확인 대상자별 읽음 현황을 조회한다. 리더와 수신자로 지정되지 않은 신규 가입자는 집계에서 제외한다. 형식 오류(400), 인증 실패(401), 접근·조회 권한 없음(403), 공지 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/StudyId' }
    - { $ref: '../../components/parameters.yaml#/NoticeId' }
  responses:
    '200':
      description: 공지 읽음 현황 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/notices.yaml#/NoticeStatusesResponse' }
          example: { id: 1, memberCount: 2, readCount: 1, unreadCount: 1, remindAt: '2026-08-28T10:00:00', readMembers: [{ id: 1, name: 홍길동, profileImage: null, readAt: '2026-08-28T09:00:00' }], unreadMembers: [{ id: 2, name: 김철수, profileImage: null, lastRemindAt: null }] }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/NoticeNotFound' }
