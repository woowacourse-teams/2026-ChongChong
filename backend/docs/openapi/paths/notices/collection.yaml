parameters:
  - { $ref: '../../components/parameters.yaml#/StudyId' }
post:
  tags: [Notice]
  operationId: createNotice
  x-frontend:
    status: needs-update
    description: |
      기능 추가: 공지 작성 시 리마인드 날짜·시간을 선택하고 remindAts로 저장해야 한다.
      이미지 선택·업로드 후 반환된 fileId 목록을 표시 순서대로 attachmentFileIds에 전달하는 흐름은 미연동이다.
      새 파일을 포함한 공지 저장은 실제 업로드 검증 연결 전까지 503으로 차단된다.
    sources:
      - frontend/src/features/notice/components/NoticeForm.tsx
  x-backend:
    status: in-progress
    owner: JYL35
    description: |
      공지를 생성하고 수신자와 리마인더를 초기화한다.
      첨부 메타데이터 연결 구조를 제공하며 새 첨부는 실제 업로드 검증 연결 전까지 503으로 차단한다.
      무첨부 생성은 유지한다. 첨부 정책은 서버 설정으로 변경할 수 있다.
      #542에서 요청 필드·첨부 저장·검증 연결 지점을 구현하며, 실제 S3 조회 연결과 통합 검증은 후속 작업이다.
  summary: 공지 생성
  description: 스터디 리더가 공지를 생성한다. 첨부 식별자는 attachmentFileIds 순서로 전달한다. 기본 최대 10장·장당 5MiB·JPEG/PNG/WebP(설정 가능). 새 파일은 본인 소유여야 하며 실제 검증 연결 전에는 503을 반환하고 전체 저장을 롤백한다. 첨부 생략·null·빈 배열은 기존 무첨부 생성과 같다. 리마인드 시각은 미래여야 한다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/notices.yaml#/NoticeCreateRequest' }
        example: { title: 이번 주 공지, content: 이번 주 스터디 일정을 확인해주세요., remindAts: ['2026-08-28T10:00:00'] }
  responses:
    '201':
      description: 공지 생성 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/notices.yaml#/NoticeCreateResponse' }
          example: { noticeId: 1 }
    '400': { $ref: '../../components/responses.yaml#/NoticeWriteBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/NoticeWriteForbidden' }
    '404': { $ref: '../../components/responses.yaml#/FileNotFound' }
    '503': { $ref: '../../components/responses.yaml#/FileVerificationUnavailable' }
get:
  tags: [Notice]
  operationId: getNotices
  x-frontend:
    status: integrated
    description: "readStatus에 따라 읽음·미읽음·대상 아님을 표시한다."
    sources:
      - frontend/src/features/notice/components/MemberNoticeList.tsx
  x-backend:
    status: done
    owner: frombunny
    description: |
      공지 목록을 커서 방식으로 조회하고 역할별 읽음 현황을 반환한다. 리더 집계와 멤버의 개인 읽음 상태를 구분한다.
  summary: 공지 목록 조회
  description: 가입 전 공지를 포함한 전체 공지를 커서 방식으로 조회한다. 리더에게는 집계와 isComplete를, 스터디원에게는 readStatus를 반환한다. 확인 대상이 아니면 NOT_ASSIGNED이며 조회로 수신자를 추가하지 않는다. 역할에 해당하지 않는 필드는 생략한다. 쿼리·형식 오류(400), 인증 실패(401), 접근 권한 없음(403)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/Cursor' }
    - { $ref: '../../components/parameters.yaml#/Size' }
  responses:
    '200':
      description: 공지 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/notices.yaml#/NoticeListResponse' }
          examples:
            leader:
              summary: 리더의 전체 현황
              value: { nextCursor: null, hasNext: false, notices: [{ id: 1, title: 이번 주 공지, content: 이번 주 스터디 일정을 확인해주세요., createdAt: '2026-08-27T10:00:00', recipientCount: 5, readRecipientCount: 3, remindAt: '2026-08-28T10:00:00', isComplete: false }] }
            notAssignedMember:
              summary: 가입 전 글을 조회하는 신규 스터디원
              value: { nextCursor: null, hasNext: false, notices: [{ id: 1, title: 가입 전 글, content: 이전 내용을 확인해주세요., createdAt: '2026-08-27T10:00:00', readStatus: NOT_ASSIGNED }] }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
