parameters:
  - { $ref: '../../components/parameters.yaml#/StudyId' }
  - { $ref: '../../components/parameters.yaml#/NoticeId' }
get:
  tags: [Notice]
  operationId: getNoticeDetail
  x-frontend:
    status: needs-update
    description: |
      기능 추가: 상세 응답의 attachments를 처리하고 첨부 목록을 표시해야 한다.
      현재 웹은 제목·내용·생성 시각만 처리한다. 파일 식별자·이름·형식·크기·순서와 imageUrl을 처리해야 한다.
      #561에서 imageUrl 응답 계약을 선행 반영했으며 백엔드 구현은 진행 중이다.
      imageUrl이 null이 아니면 이미지 src로 사용하고, 만료되면 공지 상세를 다시 조회해 URL을 갱신한다.
    sources:
      - frontend/src/features/notice/api.ts
      - frontend/src/features/notice/responseSchemas.ts
  x-backend:
    status: in-progress
    owner: JYL35
    description: |
      공지 상세를 조회하며 스터디 소속을 검증한다.
      현재 스터디 구성원은 가입 전 공지도 열람할 수 있다. 조회로 확인 대상에 추가되지 않는다.
      #556으로 첨부 메타데이터 조회가 dev에 반영됐다. 첨부가 없으면 빈 배열이다.
      #561에서 기존 FileImageUrlGenerator를 재사용해 조회 권한 확인 후 첨부별 imageUrl을 제공한다.
      아래 스키마와 예제는 imageUrl 추가 후 계약을 먼저 반영한 것이며 구현·통합 검증은 진행 중이다.
  summary: 공지 상세 조회
  description: |
    스터디 소속을 확인한 뒤 공지 상세와 표시 순서대로 정렬한 첨부 목록을 반환한다.
    현재 스터디원은 가입 전 공지와 이전 리더 소유의 첨부도 조회할 수 있다.
    파일 소유자라도 현재 스터디원이 아니면 조회할 수 없다. 권한·공지 존재 확인 후에만 URL을 생성한다.
    각 첨부의 imageUrl은 JPEG·PNG·WebP용 S3 presigned GET URL이며 공통 생성기 미지원 형식이면 null이다.
    URL 유효기간은 aws.s3.url-validity(기본 10분, AWS_URL_VALIDITY로 변경)를 따르고,
    만료 시 이 API를 다시 호출해 URL을 발급받는다. 예제 URL은 구조 설명용이며 실제 응답 URL로 이미지를 조회한다.
    조회 중 파일 상태·첨부 관계는 변경하지 않으며 S3 파일 존재·크기를 재검증하지 않는다.
    형식 오류(400), 인증 실패(401), 접근 권한 없음(403), 공지 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: 공지 상세 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/notices.yaml#/NoticeDetailResponse' }
          examples:
            withAttachments:
              summary: 이미지 두 장을 첨부한 공지
              value:
                id: 1
                title: 이번 주 공지
                content: 이번 주 스터디 일정을 확인해주세요.
                createdAt: '2026-08-27T10:00:00'
                attachments:
                  - fileId: 101
                    originalFileName: schedule.png
                    contentType: image/png
                    size: 1024
                    sortOrder: 0
                    imageUrl: 'https://example.com/notice-images/schedule.png?X-Amz-Expires=600&X-Amz-Signature=example'
                  - fileId: 102
                    originalFileName: meeting.webp
                    contentType: image/webp
                    size: 2048
                    sortOrder: 1
                    imageUrl: 'https://example.com/notice-images/meeting.webp?X-Amz-Expires=600&X-Amz-Signature=example'
            withoutAttachments:
              summary: 첨부 없는 공지
              value:
                id: 1
                title: 이번 주 공지
                content: 이번 주 스터디 일정을 확인해주세요.
                createdAt: '2026-08-27T10:00:00'
                attachments: []
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404':
      description: 공지가 존재하지 않음
      content:
        application/json:
          schema: { $ref: '../../components/schemas/errors.yaml#/NoticeNotFoundError' }
          example: { code: NOTICE_NOT_FOUND, message: 존재하지 않는 공지입니다. }
patch:
  tags: [Notice]
  operationId: updateNotice
  x-frontend:
    status: needs-update
    description: |
      기능 추가: 공지 수정 시 리마인드 예약을 추가·변경·취소해야 한다.
      기존 첨부 목록을 불러오고 attachmentFileIds로 유지·추가·제거·순서 변경을 전달하는 흐름은 미연동이다.
      새 파일은 S3 업로드 후 업로드 완료 API에 성공한 fileId로 추가해야 한다.
      기존 첨부 유지·순서 변경에는 기존 fileId를 사용한다.
    sources:
      - frontend/src/features/notice/components/NoticeForm.tsx
  x-backend:
    status: done
    owner: JYL35
    description: |
      공지를 부분 수정하고 대기 중인 리마인더를 교체한다. 이미 발송된 기록은 유지한다.
      attachmentFileIds 생략·null은 유지, 빈 배열은 제거, 배열은 표시 순서까지 교체한다.
      #554에서 신규 첨부를 COMPLETED 파일로 받고, 제거 파일은 상태를 유지한 채 관계만 정리하도록 전환했다.
      소유권·이미지 정책·기존 연결 여부를 검증하며 S3 조회나 완료 전환은 수행하지 않는다.
      #556으로 dev에 병합됐으며 관련 테스트와 CI 검증을 통과했다.
  summary: 공지 수정
  description: |
    스터디 리더가 공지를 부분 수정한다. attachmentFileIds 생략·null은 유지, 빈 배열은 전체 제거,
    배열은 최종 목록과 표시 순서를 지정한다. 새 파일은 POST /api/files/{fileId}/complete에 성공한
    COMPLETED 상태·본인 소유이며 다른 공지·과제·제출물에 연결되지 않아야 한다.
    PENDING·DELETE_PENDING 또는 다른 대상에 연결된 새 파일은 400 FILE_NOT_ATTACHABLE로 거부한다.
    기본 최대 10장·장당 5MiB·JPEG/PNG/WebP이며 빈 파일은 허용하지 않는다. 허용 형식·용량·개수는
    서버 설정으로 변경할 수 있고 공통 업로드 용량 제한도 함께 적용된다.
    최종 첨부 개수 제한은 명시한 배열 전체에 적용하며 소유권·이미지 형식·크기는 새 파일에 적용한다.
    이전 리더 소유의 기존 첨부도 유지·재정렬할 수 있다. 공지는 S3 조회나 완료 전환을 다시 수행하지 않는다.
    실패 시 제목·내용·리마인더·첨부 관계 변경을 롤백하며 선행 완료 API의 COMPLETED 상태는 유지된다.
    제거 파일은 첨부 관계만 정리하고 COMPLETED로 유지한다. 미연결 파일은 소유자가 다시 첨부할 수 있다.
    기존 DELETE_PENDING 파일은 복구하지 않으며 실제 S3 삭제는 후속 정리 작업에서 수행한다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    description: |
      예제의 첨부 ID는 실제 fileId로 대체한다. 새로 추가하는 ID는 업로드 완료 API에 성공한
      본인 소유·미연결 파일이어야 하며, 유지하는 첨부는 해당 공지의 기존 fileId를 사용한다.
    content:
      application/json:
        schema: { $ref: '../../components/schemas/notices.yaml#/NoticeUpdateRequest' }
        examples:
          replaceAttachments:
            summary: 첨부 목록과 표시 순서 교체
            description: 기존 첨부가 101·102라면 101을 제거하고 102를 유지하며 완료된 새 파일 103을 추가한다.
            value:
              title: 수정된 공지
              content: 수정된 공지 내용입니다.
              remindAts: ['2099-12-30T10:00:00']
              attachmentFileIds: [102, 103]
          clearAttachments:
            summary: 첨부 전체 제거
            value:
              attachmentFileIds: []
          keepAttachments:
            summary: 기존 첨부를 유지하고 제목만 수정
            description: attachmentFileIds를 생략하면 기존 첨부 목록과 순서를 유지한다.
            value:
              title: 수정된 공지
  responses:
    '204': { description: 공지 수정 성공. 응답 본문 없음. }
    '400': { $ref: '../../components/responses.yaml#/NoticeWriteBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/NoticeWriteForbidden' }
    '404': { $ref: '../../components/responses.yaml#/NoticeOrFileNotFound' }
delete:
  tags: [Notice]
  operationId: deleteNotice
  x-frontend:
    status: integrated
    description: "공지 삭제 요청과 본문 없는 응답을 처리한다."
    sources:
      - frontend/src/features/notice/api.ts
  x-backend:
    status: done
    owner: JYL35
    description: |
      #554에서 공지 삭제 시 첨부 관계와 알림을 정리하고 파일은 COMPLETED로 유지하도록 전환했다.
      #556으로 dev에 병합됐으며 관련 테스트와 CI 검증을 통과했다. S3 물리 삭제는 후속 정리 작업의 책임이다.
  summary: 공지 삭제
  description: |
    스터디 리더가 공지를 삭제한다. 첨부 관계와 알림은 정리하고 파일 메타데이터와 COMPLETED 상태는 유지한다.
    미연결 파일은 소유자가 다시 첨부할 수 있으며 실제 S3 삭제는 후속 정리 작업에서 수행한다.
    형식 오류(400), 인증 실패(401), 접근·삭제 권한 없음(403), 공지 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  responses:
    '204': { description: 공지 삭제 성공. 응답 본문 없음. }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/NoticeNotFound' }
