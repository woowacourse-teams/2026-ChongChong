get:
  tags: [User]
  operationId: getMyProfile
  x-frontend:
    status: needs-update
    description: |
      기능 추가: #622의 홈 이미지 변경·초기화 후 내 프로필을 갱신하고 null은 기본 이미지로 표시한다.
      업로드 이미지 URL이 만료되면 내 프로필을 재조회한다. 응답 키는 기존 name·profileImageUrl을 유지한다.
      업로드 이미지 응답과 기본 이미지 처리는 백엔드에서 구현·검증했으며 PR 검토 및 배포 환경 확인 대기다.
    sources:
      - frontend/src/features/user/components/ProfileSection.tsx
      - frontend/src/features/user/api.ts
      - frontend/src/features/user/queries.ts
  x-backend:
    status: review
    owner: JYL35
    description: |
      #363 홈 마이페이지 기본 프로필 조회에 #622의 업로드 파일 조회 URL 및 기본 이미지 초기화 응답을 반영했다.
      업로드 파일·기존 외부 URL·기본 이미지의 응답을 자동화 테스트로 검증했다. #622 확장은 PR 검토 및 배포 환경 확인 대기다.
  summary: 내 프로필 조회
  description: |
    인증된 사용자의 홈 프로필 이름과 프로필 이미지 URL을 조회한다.
    프로필 이미지를 등록하지 않은 경우 profileImageUrl은 null이다.
    홈 프로필은 소셜 최초 로그인 시 공급자 프로필로 생성하며, 재로그인 시 기존 값을 덮어쓰지 않는다.
    업로드 파일이 연결되면 조회용 presigned GET URL을 반환하고, 그렇지 않으면 기존 외부 URL을 사용한다.
    홈 이미지 초기화 후에는 profileImageUrl 키를 포함해 null을 반환한다. 업로드 이미지의 조회 URL은 공통 유효기간(기본 10분) 이후
    만료되므로 내 프로필을 다시 조회한다.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: 내 프로필 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/users.yaml#/UserProfileResponse' }
          examples:
            uploadedImage:
              summary: 업로드 이미지가 연결된 홈 프로필
              value: { name: 바니, profileImageUrl: 'https://example.com/profiles/avatar.webp?X-Amz-Expires=600&X-Amz-Signature=example' }
            socialImage:
              summary: 기존 외부 이미지가 있는 홈 프로필
              value: { name: 바니, profileImageUrl: 'https://cdn.example.com/profiles/uuid.webp' }
            defaultImage:
              summary: 기본 이미지
              value: { name: 바니, profileImageUrl: null }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }

patch:
  tags: [User]
  operationId: updateMyProfileName
  x-backend:
    status: review
    owner: JYL35
    description: |
      #423 이름 수정과 #455의 현재 참여 스터디 멤버 이름 동기화를 유지한다.
      #622에서 이름 수정 응답에도 현재 홈 이미지의 조회 URL을 반영했다. 이미지 연결 보존과 동시 이미지 교체를 자동화 테스트로 검증했다.
      #622 확장은 PR 검토 및 배포 환경 확인 대기다.
  summary: 내 홈 프로필 이름 수정
  description: |
    인증된 사용자의 홈 프로필 이름을 수정한다. 프로필 이미지 연결은 변경하지 않고 현재 홈 이미지를 응답한다.
    업로드 파일이 연결되어 있으면 응답 시 조회 URL을 생성한다.
    조회 URL 문자열 자체가 이전 응답과 같다는 보장은 없다.
    이름 수정 시 현재 참여 중인 모든 스터디의 해당 사용자 멤버 이름도 같은 트랜잭션에서 변경한다.
    새 스터디 생성·가입 시에는 변경된 홈 이름을 멤버 이름의 초깃값으로 복사한다.
    이 API는 이름을 동기화하며 홈 이미지 연결은 변경하지 않는다. 스터디별 이미지 수정과 선택 방식은 별도 후속 작업이다.
    수정 요청의 이름은 1~8자이며 공백만 있는 값은 허용하지 않는다.
    소셜 최초 로그인으로 저장하는 이름의 기존 최대 255자 정책은 변경하지 않는다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/users.yaml#/UserProfileNameUpdateRequest' }
        example: { name: 바니 }
  responses:
    '200':
      description: 홈 프로필 이름 수정 성공. 현재 홈 이미지를 반환하며 이미지 연결은 유지한다.
      content:
        application/json:
          schema: { $ref: '../../components/schemas/users.yaml#/UserProfileResponse' }
          example: { name: 바니, profileImageUrl: 'https://cdn.example.com/profiles/uuid.webp' }
    '400': { $ref: '../../components/responses.yaml#/UserProfileNameUpdateBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }

delete:
  tags: [User]
  operationId: withdrawUser
  x-backend:
    status: done
    owner: JYL35
    description: |
      #340 사용자 탈퇴 API. 사용자 행 잠금과 리더 멤버십 검사를 거쳐 계정 및 종속 데이터를 삭제한다.
  summary: 사용자 탈퇴
  description: |
    홈 마이페이지에서 현재 로그인한 사용자의 계정을 탈퇴 처리한다. 요청 본문은 없다.
    사용자 행을 잠금 조회한 뒤 리더인 현재 스터디가 있는지 확인한다. 하나라도 있으면
    아무 데이터도 삭제하지 않고 409를 반환한다. 현재 리더 위임 API가 없으므로
    리더는 해당 스터디를 먼저 삭제한 뒤 탈퇴해야 한다.
    탈퇴가 허용되면 하나의 트랜잭션에서 사용자 행을 삭제한다. 데이터베이스 외래 키의
    연쇄 삭제로 해당 사용자의 모든 인증 세션, 소셜 계정, 푸시 토큰, 스터디 멤버십과 멤버십에 종속된
    제출물, 공지 수신 상태 및 알림도 함께 삭제된다.
    홈 프로필과 파일의 연결도 제거한다. 업로드 파일은 owner_id만 null로 분리하고 상태와 메타데이터를 보존한다.
    공지·과제 등 기존 리소스에서 사용하는 파일은 계속 조회할 수 있다. 연결이 없는 파일의 DB·S3 삭제는 별도 정리 작업에서 수행한다.
    다른 브라우저의 인증 세션도 모두 삭제되므로 기존 Refresh Token으로는 재발급할 수 없다.
    이미 발급된 액세스 토큰을 즉시 무효화하는 것은 아니며, 클라이언트는 탈퇴 성공 후 보관 중인 액세스 토큰을 제거한다.
    성공 응답에서는 브라우저의 Refresh Token 쿠키를 즉시 만료시킨다. 인증 실패, 사용자 부재,
    리더 스터디 존재로 탈퇴가 완료되지 않은 경우에는 Refresh Token 쿠키를 변경하지 않는다.
  security: [{ bearerAuth: [] }]
  responses:
    '204':
      description: 사용자 탈퇴 성공. 응답 본문 없음.
      headers:
        Set-Cookie: { description: 즉시 만료된 Refresh Token 쿠키, schema: { type: string } }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }
    '409': { $ref: '../../components/responses.yaml#/StudyLeaderWithdrawalBlocked' }
