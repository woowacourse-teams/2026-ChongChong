patch:
  tags: [User]
  operationId: updateMyProfileImage
  x-frontend:
    status: needs-update
    description: |
      기능 추가: 홈 프로필에서 이미지를 선택하고 업로드 URL 발급 → S3 PUT → 업로드 완료 API → 이 API 순서로 호출한다.
      완료에 성공한 fileId만 전달하고, 성공 후 내 프로필과 관련 멤버·공지·제출물·댓글 조회 캐시를 갱신한다.
      현재는 OpenAPI 계약을 먼저 작성한 단계로 백엔드 구현은 진행 중이다.
    sources:
      - frontend/src/features/user/components/ProfileSection.tsx
      - frontend/src/features/user/api.ts
      - frontend/src/features/user/queries.ts
  x-backend:
    status: in-progress
    owner: JYL35
    description: |
      #622 홈 프로필 이미지 변경 계약을 먼저 작성했다. Controller·파일 연결·이미지 정책 및 회귀 검증은 구현 전이다.
      User와 StudyMember를 분리하고 홈을 따르는 멤버에는 변경을 반영하며 스터디 전용 설정은 보존한다.
  summary: 내 홈 프로필 이미지 변경
  description: |
    인증된 사용자의 홈 프로필 이미지를 업로드 완료된 파일로 교체한다. 이름은 변경하지 않는다.
    POST /api/files/presigned-url → 반환된 URL에 S3 PUT → POST /api/files/{fileId}/complete 이후 호출한다.
    프로필 업로드는 uploadPurpose를 생략하거나 null로 보내 기존 공통 경로를 사용한다.
    S3 PUT에는 발급 요청과 같은 Content-Type과 If-None-Match: * 헤더를 보낸다.

    새 파일은 본인 소유의 COMPLETED 상태이며 공지·과제·제출물·스터디 대표 이미지·다른 프로필에 미연결이어야 한다.
    기본 정책은 JPEG/PNG/WebP 한 장, 0바이트 초과·최대 5MiB다. 허용 형식·용량은 서버 설정으로 변경할 수 있으며
    공통 업로드 용량 제한도 함께 적용한다. 형식 정책은 파일 메타데이터의 Content-Type을 기준으로 검증한다.
    현재 본인 홈 프로필에 연결된 같은 COMPLETED 파일을 다시 지정하면 기존 연결을 유지하고 성공한다.

    홈을 따르는 현재 스터디 멤버는 다음 조회부터 새 이미지를 사용한다. 스터디 전용 이미지는 변경하지 않는다.
    새 스터디 생성·가입 시에는 홈 프로필 사용이 기본이다. 스터디별 이미지 수정 API는 별도 후속 작업이다.
    응답의 profileImageUrl은 조회용 S3 presigned GET URL이며 DB에 저장하지 않는다.
    공통 aws.s3.url-validity(기본 10분, AWS_URL_VALIDITY로 변경) 이후 만료되면 내 프로필을 다시 조회한다.

    공통 완료 API의 S3 존재·크기 확인을 다시 수행하거나 파일을 완료 상태로 전환하지 않는다.
    기존 파일은 연결만 해제하고 COMPLETED를 유지하며 S3 물리 삭제는 미사용 파일 정리 작업에서 처리한다.
    실패 시 홈 프로필 연결 변경은 롤백하고 선행 완료 API에서 확정한 파일 상태는 유지한다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    description: 업로드 완료 API에 성공한 실제 fileId를 사용한다. 생략·null·0·음수는 허용하지 않는다. 기본 이미지 초기화는 DELETE로 요청한다.
    content:
      application/json:
        schema: { $ref: '../../components/schemas/users.yaml#/UserProfileImageUpdateRequest' }
        example: { fileId: 123 }
  responses:
    '200':
      description: 홈 프로필 이미지 변경 성공 또는 현재 파일의 재지정 성공. 현재 이름과 이미지 조회 URL을 반환한다.
      content:
        application/json:
          schema: { $ref: '../../components/schemas/users.yaml#/UserProfileResponse' }
          example:
            name: 바니
            profileImageUrl: 'https://example.com/profiles/avatar.webp?X-Amz-Expires=600&X-Amz-Signature=example'
    '400': { $ref: '../../components/responses.yaml#/UserProfileImageUpdateBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/FileNotOwned' }
    '404': { $ref: '../../components/responses.yaml#/UserOrFileNotFound' }
delete:
  tags: [User]
  operationId: resetMyProfileImage
  x-frontend:
    status: needs-update
    description: |
      기능 추가: 홈 프로필의 기본 이미지 초기화 동작을 연결하고 본문 없는 204 응답을 처리한다.
      성공 후 내 프로필과 관련 조회 캐시를 갱신하고 null 이미지는 프론트 기본 이미지로 표시한다.
      스터디 전용 이미지와 홈 프로필 사용 여부를 바꾸는 요청은 아니다. 백엔드는 명세 선행 단계다.
    sources:
      - frontend/src/features/user/components/ProfileSection.tsx
      - frontend/src/features/user/api.ts
      - frontend/src/features/user/queries.ts
  x-backend:
    status: in-progress
    owner: JYL35
    description: |
      #622 홈 이미지 초기화 계약을 먼저 작성했다. Controller·파일 연결 해제 및 회귀 검증은 구현 전이다.
      홈 파일 연결과 기존 외부 URL을 해제하며 홈 상속 멤버의 기본 이미지와 스터디 전용 이미지 보존을 검증할 예정이다.
  summary: 내 홈 프로필 이미지 초기화
  description: |
    요청 본문 없이 현재 사용자의 홈 프로필 이미지를 기본 이미지로 초기화한다. 이름은 변경하지 않는다.
    업로드 파일 연결과 기존 소셜 이미지 등 외부 URL을 함께 해제한다. 소셜 이미지로 복원하는 기능은 아니다.
    성공 후 GET /api/users/me는 profileImageUrl 키를 포함해 null을 반환한다.
    홈 프로필을 따르는 멤버의 이미지도 다음 조회에서 null이며 스터디 전용 이미지는 유지한다.
    null은 프론트의 기본 이미지를 뜻하며 스터디 전용 설정에서 홈 상속으로 바꾸지는 않는다.
    이미 기본 이미지인 경우에도 204를 반환한다. 응답 본문과 파일 ID 요청은 없다.
    분리한 파일은 COMPLETED를 유지하며 S3 파일 조회·삭제는 수행하지 않는다.
  security: [{ bearerAuth: [] }]
  responses:
    '204': { description: 홈 프로필 이미지 초기화 성공 또는 이미 기본 이미지 상태. 응답 본문 없음. }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }
