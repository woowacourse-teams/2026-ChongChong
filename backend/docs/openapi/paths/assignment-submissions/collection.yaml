parameters:
  - { $ref: '../../components/parameters.yaml#/StudyId' }
  - { $ref: '../../components/parameters.yaml#/AssignmentId' }
post:
  tags: [Assignment Submission]
  operationId: submitAssignment
  x-backend:
    status: done
    owner: frombunny
    description: |
      기존 제출 행에 내용·링크를 등록하고 서버에서 최초 제출 시각을 기록한다. 재제출하면 내용·링크를 덮어쓰되 최초 제출 시각은 유지한다. 현재 마감 이후 제출을 차단하지 않는다.
      제출 대상으로 포함된 리더도 본인의 과제를 제출할 수 있다.
      2026-10-03 확인: 마감 후 최초 제출은 LATE_SUBMITTED로 조회된다. 최초 제출에만 제출자를 제외한 리더들에게 알림을 생성하며 재제출은 알림을 추가하지 않는다.
      후속 예정: 이미지·파일 제출 형식(#296).
  x-frontend:
    status: needs-update
    description: |
      입력 계약 반영: content와 link는 각각 선택 값이며 최대 10,000자다. 링크만 제출하는 입력과 길이 제한을 반영한다.
      내 제출 상태가 NOT_ASSIGNED이면 제출 요청을 보내지 않는다.
      2026-10-03 변경: MISSING이어도 제출을 허용하고, 제출 후 내 제출 정보를 다시 조회하여 LATE_SUBMITTED를 표시한다.
      미해당 사용자의 요청은 404 ASSIGNMENT_SUBMISSION_NOT_FOUND이며, 과제가 삭제된 경우와 구분한다.
    sources:
      - frontend/src/features/assignment/components/MyAssignmentSubmission.tsx
  summary: 과제 제출
  description: 현재 사용자가 과제 답안 또는 링크를 제출한다. 마감 후에도 제출할 수 있으며 최초 제출 시각을 기준으로 정상·지각 제출을 구분한다. 재제출하면 내용·링크를 덮어쓰되 최초 제출 시각은 유지하며, 제출자를 제외한 리더 대상 알림은 최초 제출에만 생성한다. 입력·형식·내용·링크 오류(400), 인증 실패(401), 접근 권한 없음(403), 과제·제출 정보 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/AssignmentSubmitRequest' }
        example: { content: 이번 주 과제를 완료했습니다., link: 'https://github.com/example/project' }
  responses:
    '201':
      description: 과제 제출 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/AssignmentSubmitResponse' }
          example: { submissionId: 1 }
    '400': { $ref: '../../components/responses.yaml#/SubmissionWriteBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentOrSubmissionNotFound' }
get:
  tags: [Assignment Submission]
  operationId: getSubmissionList
  x-frontend:
    status: needs-update
    description: "공개 과제의 제출 완료 목록 조회와 submissionStatus의 SUBMITTED·LATE_SUBMITTED 표시를 반영한다."
    sources:
      - frontend/src/features/assignment/components/MemberAssignmentDetailContent.tsx
  x-backend:
    status: review
    owner: frombunny
    description: |
      리더 또는 공개 과제의 스터디원이 제출 완료 목록을 조회한다. submittedAt이 있는 제출물만 반환한다.
      공개 과제는 자신의 제출 여부나 제출 행 유무와 관계없이 소속 멤버가 조회할 수 있다.
      각 제출물의 submissionStatus는 SUBMITTED 또는 LATE_SUBMITTED이다.
  summary: 과제 제출 목록 조회
  description: LEADER_ONLY 과제는 리더만, ALL_STUDY_MEMBERS 과제는 모든 소속 멤버가 제출 완료 목록을 조회한다. 미제출 내용은 목록에 포함하지 않는다. 비회원은 공개 여부와 무관하게 거부한다. 형식 오류(400), 인증 실패(401), 접근·조회 권한 없음(403), 과제 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: 과제 제출 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/SubmissionListResponse' }
          example: { submissions: [{ id: 1, name: 홍길동, profileImage: null, submissionStatus: SUBMITTED, createdAt: '2026-08-27T10:30:00' }, { id: 2, name: 김철수, profileImage: null, submissionStatus: LATE_SUBMITTED, createdAt: '2026-08-30T10:30:00' }] }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentNotFound' }
