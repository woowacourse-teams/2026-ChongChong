parameters:
  - { $ref: '../../components/parameters.yaml#/StudyId' }
  - { $ref: '../../components/parameters.yaml#/AssignmentId' }
post:
  tags: [Assignment Submission]
  operationId: submitAssignment
  x-backend:
    status: done
    owner: frombunny
    description: |
      기존 제출 행에 내용·링크를 등록하고 서버에서 최초 제출 시각을 기록한다. 재제출하면 내용·링크를 덮어쓰되 최초 제출 시각은 유지한다. 현재 마감 이후 제출을 차단하지 않는다.
      제출 대상으로 포함된 리더도 본인의 과제를 제출할 수 있다.
      2026-10-03 확인: 마감 후 최초 제출은 LATE_SUBMITTED로 조회된다. 최초 제출에만 제출자를 제외한 리더들에게 알림을 생성하며 재제출은 알림을 추가하지 않는다.
      완료된 이미지·파일 첨부 연결을 지원한다.
      과제 행 잠금 대기는 3초로 제한하고, 넘으면 롤백 후 503 ASSIGNMENT_SUBMISSION_BUSY를 반환한다(ADR-0070).
  x-frontend:
    status: needs-update
    description: |
      웹 폼도 내용·링크·첨부 중 하나 이상을 요구하여 링크만 또는 첨부만 제출할 수 있다.
      대상 제외 후 보존된 제출물의 assigned=false를 반영해 제출·수정 동작을 제한하는 처리는 남아 있다.
      계약 수정: 같은 과제 제출이 몰려 503 ASSIGNMENT_SUBMISSION_BUSY가 오면 잠시 후 다시 시도하도록 안내할 수 있다.
    sources:
      - frontend/src/features/assignment/components/MyAssignmentSubmission.tsx
      - frontend/src/features/assignment/components/AssignmentSubmissionForm.tsx
  summary: 과제 제출
  description: 현재 사용자가 과제 답안 또는 링크를 제출한다. 마감 후에도 제출할 수 있으며 최초 제출 시각을 기준으로 정상·지각 제출을 구분한다. 재제출에서 content·link를 생략하거나 null로 보내면 null로 덮어쓴다. attachmentFileIds는 생략·null이면 유지하고 빈 배열이면 제거한다. 최종 내용·링크·첨부가 모두 비어 있으면 EMPTY_SUBMISSION으로 거부한다. 최초 제출 시각은 유지하며, 제출자를 제외한 리더 대상 알림은 최초 제출에만 생성한다. 입력·형식·내용·링크 오류(400), 인증 실패(401), 접근 권한 없음(403), 과제·제출 정보 없음(404), 과제 잠금 대기 3초 초과(503)를 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/AssignmentSubmitRequest' }
        example: { content: 이번 주 과제를 완료했습니다., link: 'https://github.com/example/project' }
  responses:
    '201':
      description: 과제 제출 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/AssignmentSubmitResponse' }
          example: { submissionId: 1 }
    '400': { $ref: '../../components/responses.yaml#/SubmissionWriteBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/AssignmentAttachmentForbidden' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentAttachmentNotFound' }
    '503':
      description: 같은 과제의 다른 요청이 과제 행 잠금을 3초 넘게 쥐고 있어 제출하지 못함. 롤백되며 잠시 후 같은 요청을 다시 시도할 수 있다.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, const: ASSIGNMENT_SUBMISSION_BUSY }
              message: { type: string }
          example: { code: ASSIGNMENT_SUBMISSION_BUSY, message: 다른 요청을 처리하는 중이에요. 잠시 후 다시 시도해 주세요. }
get:
  tags: [Assignment Submission]
  operationId: getSubmissionList
  x-frontend:
    status: integrated
    description: "공개 과제에서 일반 멤버도 제출 완료 목록을 조회한다. 지각 제출 배지와 제출 상세 이동이 연결되어 있다."
    sources:
      - frontend/src/features/assignment/components/MemberAssignmentDetailContent.tsx
      - frontend/src/features/assignment/components/CompletedSubmissionList.tsx
  x-backend:
    status: done
    owner: frombunny
    description: |
      리더 또는 공개 과제의 스터디원이 제출 완료 목록을 조회한다. submittedAt이 있는 제출물만 반환한다.
      공개 과제는 자신의 제출 여부나 제출 행 유무와 관계없이 소속 멤버가 조회할 수 있다.
      각 제출물의 submissionStatus는 SUBMITTED 또는 LATE_SUBMITTED이다.
  summary: 과제 제출 목록 조회
  description: LEADER_ONLY 과제는 리더만, ALL_STUDY_MEMBERS 과제는 모든 소속 멤버가 제출 완료 목록을 조회한다. 미제출 내용은 목록에 포함하지 않는다. 현재 대상에서 제외됐더라도 제출 완료 기록은 목록에 포함한다. 비회원은 공개 여부와 무관하게 거부한다. 형식 오류(400), 인증 실패(401), 접근·조회 권한 없음(403), 과제 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: 과제 제출 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/SubmissionListResponse' }
          example: { submissions: [{ id: 1, name: 홍길동, profileImage: null, submissionStatus: SUBMITTED, createdAt: '2026-08-27T10:30:00' }, { id: 2, name: 김철수, profileImage: null, submissionStatus: LATE_SUBMITTED, createdAt: '2026-08-30T10:30:00' }] }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentNotFound' }
