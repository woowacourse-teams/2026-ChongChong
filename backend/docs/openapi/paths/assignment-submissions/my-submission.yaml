get:
  tags: [Assignment Submission]
  operationId: getMySubmissionDetail
  x-backend:
    status: done
    owner: frombunny
    description: |
      현재 사용자의 제출 정보와 assigned를 반환한다. 대상에서 제외돼도 기존 제출물과 최초 제출 시각을 보존하며 제출 완료 상태를 유지한다.
      2026-10-03 변경: LATE_SUBMITTED(지각 제출), MISSING(마감 후 미제출) 상태를 추가했다. 관련 테스트는 통과했다.
  x-frontend:
    status: needs-update
    description: |
      다섯 제출 상태와 상태별 필드 유무를 검증한다. 계약 수정: assigned를 검증하고 false이면 기존 제출물을 보여주되 제출·수정 동작을 제한해야 한다. 제출 완료 상태만으로 수정 가능 여부를 판단하지 않는다.
      제출 완료 상태의 content와 link는 선택 문자열로 처리하며 링크에 URL 형식을 강제하지 않는다.
    sources:
      - frontend/src/features/assignment/responseSchemas.ts
      - frontend/src/features/assignment/components/MyAssignmentSubmission.tsx
  summary: 내 과제 제출 조회
  description: 본인의 제출 상태를 NOT_ASSIGNED, NOT_SUBMITTED, SUBMITTED, LATE_SUBMITTED, MISSING으로 구분한다. assigned는 항상 반환한다. 제출 행이 없으면 NOT_ASSIGNED와 assigned=false 및 빈 attachments를 반환한다. 제외된 기존 행은 submissionId를 유지하며, 제출 완료 기록이 있으면 내용·첨부 및 SUBMITTED 또는 LATE_SUBMITTED를 반환하고 기록이 없으면 NOT_ASSIGNED를 반환한다. 제외 중 제출·수정은 거부하며 재추가 후 허용한다. 미제출 상태에서 현재 시각이 마감 시각을 지나면 MISSING이며, 최초 제출 시각이 마감 시각을 지나면 LATE_SUBMITTED이다. 마감 시각과 같은 시각에 제출하면 SUBMITTED이다. 회원 및 과제 소속을 검증하며 형식 오류(400), 인증 실패(401), 접근 권한 없음(403), 과제 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/StudyId' }
    - { $ref: '../../components/parameters.yaml#/AssignmentId' }
  responses:
    '200':
      description: 내 제출 조회 성공. 제출 대상 여부와 관계없이 JSON 객체를 반환한다.
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/MySubmissionDetailResponse' }
          examples:
            submitted: { value: { assigned: true, submissionId: 1, submissionStatus: SUBMITTED, createdAt: '2026-08-27T10:30:00', content: 이번 주 과제를 완료했습니다., link: 'https://github.com/example/project' } }
            beforeSubmit: { value: { assigned: true, submissionId: 1, submissionStatus: NOT_SUBMITTED } }
            missing: { summary: 마감 후에도 제출하지 않은 대상자, value: { assigned: true, submissionId: 1, submissionStatus: MISSING } }
            lateSubmitted: { summary: 마감 후 최초 제출한 대상자, value: { assigned: true, submissionId: 1, submissionStatus: LATE_SUBMITTED, createdAt: '2026-08-30T10:30:00', content: 늦게 제출한 과제입니다. } }
            excludedAfterSubmit: { summary: 제출 후 대상에서 제외된 사용자, value: { assigned: false, submissionId: 1, submissionStatus: SUBMITTED, createdAt: '2026-08-27T10:30:00', content: 보존된 제출 내용, attachments: [] } }
            notAssigned: { value: { assigned: false, submissionStatus: NOT_ASSIGNED, attachments: [] } }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentNotFound' }
