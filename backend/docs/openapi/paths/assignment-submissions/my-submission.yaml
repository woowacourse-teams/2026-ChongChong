get:
  tags: [Assignment Submission]
  operationId: getMySubmissionDetail
  x-backend:
    status: done
    owner: frombunny
    description: |
      현재 사용자의 제출 정보를 조회한다. 제출 대상이면 submissionId를 반환하고, 대상이 아니면 NOT_ASSIGNED를 반환한다.
  summary: 내 과제 제출 조회
  description: 본인의 제출 상태를 SUBMITTED, NOT_SUBMITTED, NOT_ASSIGNED로 구분한다. 제출 대상이 아니면 submissionStatus만 반환한다. 회원 및 과제 소속을 검증하며 형식 오류(400), 인증 실패(401), 접근 권한 없음(403), 과제 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/StudyId' }
    - { $ref: '../../components/parameters.yaml#/AssignmentId' }
  responses:
    '200':
      description: 내 제출 조회 성공. 제출 대상 여부와 관계없이 JSON 객체를 반환한다.
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/MySubmissionDetailResponse' }
          examples:
            submitted: { value: { submissionId: 1, submissionStatus: SUBMITTED, createdAt: '2026-08-27T10:30:00', content: 이번 주 과제를 완료했습니다., link: 'https://github.com/example/project' } }
            beforeSubmit: { value: { submissionId: 1, submissionStatus: NOT_SUBMITTED } }
            notAssigned: { value: { submissionStatus: NOT_ASSIGNED } }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentNotFound' }
