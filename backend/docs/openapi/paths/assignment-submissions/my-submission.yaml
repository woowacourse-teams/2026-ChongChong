get:
  tags: [Assignment Submission]
  operationId: getMySubmissionDetail
  x-backend:
    status: done
    owner: frombunny
    description: |
      현재 사용자의 제출 정보를 조회한다. 제출 대상이면 submissionId를 반환하고, 대상이 아니면 NOT_ASSIGNED를 반환한다.
      2026-10-03 변경: LATE_SUBMITTED(지각 제출), MISSING(마감 후 미제출) 상태를 추가했다. 관련 테스트는 통과했다.
  x-frontend:
    issue: 277
    description: |
      2026-10-03 변경: submissionStatus 타입과 화면 분기를 NOT_ASSIGNED / NOT_SUBMITTED / SUBMITTED / LATE_SUBMITTED / MISSING으로 확장한다.
      미해당도 빈 본문이 아닌 200 JSON 객체다. NOT_ASSIGNED에는 submissionId와 제출 상세 필드가 없다.
      NOT_SUBMITTED와 MISSING에는 submissionId가 있다. MISSING이어도 제출할 수 있으며 제출 후 LATE_SUBMITTED가 된다.
      SUBMITTED와 LATE_SUBMITTED일 때 제출 내용과 시각을 표시한다.
      NOT_ASSIGNED이면 과제는 열람하되 제출 폼과 제출 요청을 비활성화한다.
      SUBMITTED와 LATE_SUBMITTED여도 content와 link는 값이 null이면 생략된다. 선택 문자열로 처리한다.
      link는 서버에서 URL 형식을 검증하지 않는 문자열이므로 응답 검증에서 URL 형식을 강제하지 않는다.
  summary: 내 과제 제출 조회
  description: 본인의 제출 상태를 NOT_ASSIGNED, NOT_SUBMITTED, SUBMITTED, LATE_SUBMITTED, MISSING으로 구분한다. 제출 대상이 아니면 submissionStatus만 반환한다. 미제출 상태에서 현재 시각이 마감 시각을 지나면 MISSING이며, 최초 제출 시각이 마감 시각을 지나면 LATE_SUBMITTED이다. 마감 시각과 같은 시각에 제출하면 SUBMITTED이다. 회원 및 과제 소속을 검증하며 형식 오류(400), 인증 실패(401), 접근 권한 없음(403), 과제 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/StudyId' }
    - { $ref: '../../components/parameters.yaml#/AssignmentId' }
  responses:
    '200':
      description: 내 제출 조회 성공. 제출 대상 여부와 관계없이 JSON 객체를 반환한다.
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/MySubmissionDetailResponse' }
          examples:
            submitted: { value: { submissionId: 1, submissionStatus: SUBMITTED, createdAt: '2026-08-27T10:30:00', content: 이번 주 과제를 완료했습니다., link: 'https://github.com/example/project' } }
            beforeSubmit: { value: { submissionId: 1, submissionStatus: NOT_SUBMITTED } }
            missing: { summary: 마감 후에도 제출하지 않은 대상자, value: { submissionId: 1, submissionStatus: MISSING } }
            lateSubmitted: { summary: 마감 후 최초 제출한 대상자, value: { submissionId: 1, submissionStatus: LATE_SUBMITTED, createdAt: '2026-08-30T10:30:00', content: 늦게 제출한 과제입니다. } }
            notAssigned: { value: { submissionStatus: NOT_ASSIGNED } }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentNotFound' }
