parameters:
  - { $ref: '../../components/parameters.yaml#/StudyId' }
  - { $ref: '../../components/parameters.yaml#/AssignmentId' }
  - { $ref: '../../components/parameters.yaml#/SubmissionId' }
get:
  tags: [Assignment Submission]
  operationId: getSubmissionDetail
  x-frontend:
    status: needs-update
    description: "상세 API 호출은 있으나 일반 멤버의 공개 제출물 진입 경로가 없다. createdAt·content의 null 허용도 타입과 응답 검증에 반영해야 한다. 기존 연동 수정: createdAt은 미제출 상태에서 null이므로 응답 검증·타입·날짜 표시에 반영한다. 기존 연동 수정: content는 null일 수 있으므로 응답 검증과 타입에서 허용한다. 본문 없이 링크만 제출한 경우에도 상세 화면을 표시한다."
    sources:
      - frontend/src/features/assignment/responseSchemas.ts
      - frontend/src/features/assignment/types.ts
      - frontend/src/features/assignment/components/MemberAssignmentDetailContent.tsx
  x-backend:
    status: review
    owner: frombunny
    description: |
      리더·본인은 제출물 상세를 조회할 수 있고 공개 과제의 다른 스터디원은 제출 완료된 내용만 조회할 수 있다.
      미제출 상세의 createdAt은 null이며 content·link도 null일 수 있다.
  summary: 과제 제출 상세 조회
  description: 리더와 본인은 제출물 상세를 조회한다. ALL_STUDY_MEMBERS 과제에서는 다른 소속 멤버도 제출 완료된 제출물을 조회할 수 있다. 미제출 내용은 리더와 본인만 조회할 수 있고 createdAt은 null이다. 비회원은 거부한다. 형식 오류(400), 인증 실패(401), 접근·조회 권한 없음(403), 과제·제출물 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: 과제 제출 상세 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/SubmissionDetailResponse' }
          example: { id: 1, name: 홍길동, profileImage: null, createdAt: '2026-08-27T10:30:00', content: 이번 주 과제를 완료했습니다., link: 'https://github.com/example/project' }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentOrSubmissionNotFound' }
patch:
  tags: [Assignment Submission]
  operationId: updateSubmission
  x-frontend:
    status: needs-update
    description: "일반 멤버의 본인 제출물 수정은 연결되어 있다. 리더의 본인 제출물 수정 흐름은 LeaderAssignmentDetailContent에 없다. 타인 수정 권한은 추가하지 않는다. 입력 계약 반영: content와 link는 각각 최대 10,000자이며 생략하거나 null이면 기존 값을 유지한다. 빈 문자열은 값을 비우는 요청이다. 현재 폼의 본문 필수·URL 입력 제약은 서버의 필수·형식 검증과 다르므로 화면 정책을 구분한다."
    sources:
      - frontend/src/features/assignment/components/CompletedAssignmentSubmission.tsx
      - frontend/src/features/assignment/components/LeaderAssignmentDetailContent.tsx
  x-backend:
    status: done
    owner: frombunny
    description: |
      본인 제출물을 수정하며 과제와 제출물의 소속을 검증한다. 미제출 행도 수정할 수 있지만 수정 요청만으로 제출 완료 상태가 되지는 않는다.
      리더도 본인의 제출물을 수정할 수 있다.
      후속 예정: 이미지·파일 제출 검증(#296).
  summary: 과제 제출 수정
  description: 현재 사용자가 자신의 제출 내용을 수정한다. 입력·형식·내용·링크 오류(400), 인증 실패(401), 접근·수정 권한 없음(403), 과제·제출물 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/assignment-submissions.yaml#/AssignmentSubmitRequest' }
        example: { content: 수정한 제출 내용입니다., link: 'https://github.com/example/project-v2' }
  responses:
    '204': { description: 과제 제출 수정 성공. 응답 본문 없음. }
    '400': { $ref: '../../components/responses.yaml#/SubmissionWriteBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessOrActionDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentOrSubmissionNotFound' }
