post:
  tags: [Auth]
  operationId: logout
  x-frontend:
    status: integrated
    description: "마이페이지 로그아웃 메뉴에서 푸시 구독 해제 후 로그아웃을 호출한다."
    sources:
      - frontend/src/features/mypage/components/AccountMenuSection.tsx
  x-backend:
    status: review
    owner: JYL35
    description: |
      요청의 Refresh Token에 해당하는 인증 세션을 삭제하고 Refresh 쿠키를 만료시킨다.
      쿠키나 세션이 없어도 204를 반환한다. 이슈 #526의 다른 세션 유지 자동 테스트와 전체 백엔드 테스트를 통과했다.
      PR 리뷰·병합 대기 상태다.
  summary: 로그아웃
  security: []
  description: |
    요청의 Refresh Token 쿠키에 해당하는 인증 세션만 삭제하고 요청 브라우저의 Refresh Token 쿠키를 만료시킨다.
    같은 사용자가 다른 브라우저에서 로그인한 세션은 유지한다. 모든 기기를 로그아웃하는 API가 아니다.
    같은 브라우저 프로필의 탭은 Refresh Token 쿠키를 공유하므로 로그아웃 후 해당 세션으로 재발급할 수 없다.
    이미 발급된 액세스 토큰은 서버에서 즉시 무효화하지 않으므로 클라이언트는 보관 중인 액세스 토큰을 제거한다.
    Refresh Token 쿠키나 일치하는 세션이 없어도 204를 반환한다. CSRF 불일치 시에는 403을 반환한다.
  parameters:
    - { name: X-XSRF-TOKEN, in: header, required: true, description: CSRF 토큰, schema: { type: string }, example: csrf-token }
    - { name: XSRF-TOKEN, in: cookie, required: true, description: CSRF 쿠키, schema: { type: string }, example: csrf-token }
    - { name: refresh_token, in: cookie, required: false, description: 폐기할 Refresh Token 쿠키, schema: { type: string }, example: refresh-token }
  responses:
    '204':
      description: 로그아웃 성공. 응답 본문 없음.
      headers:
        Set-Cookie: { description: 즉시 만료된 Refresh Token 쿠키, schema: { type: string } }
    '403': { $ref: '../../components/responses.yaml#/InvalidCsrfToken' }
