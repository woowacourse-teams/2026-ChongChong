post:
  tags: [Auth]
  operationId: login
  x-frontend:
    status: integrated
    description: "카카오 인가 코드를 전송하고 Access Token을 저장하는 로그인 흐름이 연결되어 있다."
    sources:
      - frontend/src/features/login/api.ts
      - frontend/src/features/login/pages/KakaoCallbackPage.tsx
  x-backend:
    status: done
    owner: JYL35
    description: |
      이슈 #526에서 로그인마다 독립적인 인증 세션을 생성하도록 변경했다.
      다중 세션 자동 테스트, 전체 백엔드 테스트와 PR CI를 통과했다. 실제 두 기기 수동 확인은 별도다.
      Access Token은 JSON, Refresh Token은 HttpOnly 쿠키로 전달한다.
  summary: 소셜 로그인
  security: []
  description: |
    소셜 로그인 인가 코드로 액세스 토큰을 발급하고 로그인한 사용자의 userId를 반환한다.
    프론트는 userId를 문자열로 변환해 PostHog distinct_id로 사용한다.
    Refresh Token은 HttpOnly 쿠키로 발급한다.
    로그인에 성공할 때마다 새로운 인증 세션을 생성하며, 같은 사용자가 다른 브라우저에서
    로그인한 세션은 유지한다. 노트북과 휴대폰에서 동시에 로그인 상태를 유지할 수 있다.
    같은 브라우저 프로필의 탭은 Refresh Token 쿠키를 공유하므로 탭별로 독립적인 세션을 갖지 않는다.
    같은 브라우저에서 다시 로그인하면 해당 브라우저의 Refresh Token 쿠키는 새 값으로 교체된다.
    오류: 입력 검증/형식 오류(400), 지원하지 않는 제공자(400), CSRF 불일치(403),
    소셜 인증 실패(401), 사용자 없음(404).
  parameters:
    - { name: X-XSRF-TOKEN, in: header, required: true, description: CSRF 토큰, schema: { type: string }, example: csrf-token }
    - { name: XSRF-TOKEN, in: cookie, required: true, description: CSRF 쿠키, schema: { type: string }, example: csrf-token }
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/auth.yaml#/SocialLoginRequest' }
        example: { provider: KAKAO, authorizationCode: authorization-code-from-provider }
  responses:
    '200':
      description: 로그인 성공
      headers:
        Set-Cookie: { description: HttpOnly Refresh Token 쿠키, schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '../../components/schemas/auth.yaml#/SocialLoginResponse' }
          example: { userId: 1, tokenType: Bearer, accessToken: eyJhbGciOiJIUzI1NiJ9..., accessTokenExpiresAt: '2026-08-27T12:00:00Z' }
    '400': { $ref: '../../components/responses.yaml#/LoginBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/SocialAuthenticationFailed' }
    '403': { $ref: '../../components/responses.yaml#/InvalidCsrfToken' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }
