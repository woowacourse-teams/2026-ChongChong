post:
  tags: [Auth]
  operationId: refresh
  x-frontend:
    status: integrated
    description: "401 응답에서 쿠키 기반 재발급 후 원 요청을 재시도한다."
    sources:
      - frontend/src/features/login/api.ts
      - frontend/src/client.ts
  x-backend:
    status: in-progress
    owner: JYL35
    description: |
      Refresh Token을 갱신하고 이전 토큰의 재사용을 차단한다. 쿠키와 CSRF 헤더를 함께 전송한다.
      이슈 #526에서 같은 사용자의 여러 세션이 독립적으로 재발급되는지 검증한다.
  summary: 액세스 토큰 갱신
  security: []
  description: |
    요청의 Refresh Token 쿠키에 해당하는 인증 세션을 검증하고 새 액세스 토큰과 Refresh Token을 발급한다.
    해당 세션의 Refresh Token만 회전하며, 회전 전 Refresh Token은 더 이상 사용할 수 없다.
    같은 사용자의 다른 브라우저 세션과 그 Refresh Token 및 만료 시각은 변경하지 않는다.
    브라우저를 새로고침해 메모리의 액세스 토큰이 사라져도 유효한 Refresh Token 쿠키로 재발급할 수 있다.
    요청 형식 오류(400), 유효하지 않은 Refresh Token(401), CSRF 불일치(403)를 반환할 수 있다.
  parameters:
    - { name: X-XSRF-TOKEN, in: header, required: true, description: CSRF 토큰, schema: { type: string }, example: csrf-token }
    - { name: XSRF-TOKEN, in: cookie, required: true, description: CSRF 쿠키, schema: { type: string }, example: csrf-token }
    - { name: refresh_token, in: cookie, required: true, description: 로그인 시 발급된 Refresh Token 쿠키, schema: { type: string }, example: refresh-token }
  responses:
    '200':
      description: 토큰 갱신 성공
      headers:
        Set-Cookie: { description: 회전된 HttpOnly Refresh Token 쿠키, schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '../../components/schemas/auth.yaml#/AccessTokenRefreshResponse' }
          example: { tokenType: Bearer, accessToken: eyJhbGciOiJIUzI1NiJ9..., accessTokenExpiresAt: '2026-08-27T12:00:00Z' }
    '400': { $ref: '../../components/responses.yaml#/InvalidRequestOnly' }
    '401': { $ref: '../../components/responses.yaml#/InvalidRefreshToken' }
    '403': { $ref: '../../components/responses.yaml#/InvalidCsrfToken' }
