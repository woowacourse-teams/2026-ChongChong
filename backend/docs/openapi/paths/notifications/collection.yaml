get:
  tags: [Notification]
  operationId: getMyNotifications
  x-backend:
    status: review
    owner: wontop02
    description: 현재 인증된 사용자가 받은 알림을 ID 내림차순으로 커서 조회한다. 기본 10개, 최대 100개이며 페이지 메타데이터를 반환한다.
  summary: 내 알림 목록 조회
  description: |
    인증된 사용자의 알림을 ID 내림차순으로 커서 조회한다. 첫 조회에서는 cursor를 생략하고,
    다음 조회에서는 응답의 nextCursor를 전달한다. cursor보다 작은 ID의 알림만 반환한다.
    size는 기본 10, 최소 1, 최대 100이다. 파라미터를 생략해도 전체 목록 대신 첫 페이지를 반환한다.
    다음 페이지가 없으면 nextCursor는 null, hasNext는 false이다. 알림이 없으면 notifications는 빈 배열이다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/Cursor' }
    - { $ref: '../../components/parameters.yaml#/Size' }
  responses:
    '200':
      description: 내 알림 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/notifications.yaml#/MyNotificationListResponse' }
          example:
            nextCursor: null
            hasNext: false
            notifications:
              - id: 1
                title: '[알고리즘 스터디] 새 공지'
                body: 4주차부터 선택 미션이 추가됩니다
                type: NEW
                resourceType: NOTICE
                resourceId: 10
                deepLink: /studies/2/notices/10
                isRead: false
                createdAt: '2026-09-21T12:00:00'
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
