parameters:
  - { $ref: '../../components/parameters.yaml#/StudyId' }
post:
  tags: [Assignment]
  operationId: createAssignment
  x-frontend:
    status: needs-update
    description: "웹은 공개 범위와 본인을 포함한 제출 대상 개별·전체 선택을 지원하며 submitterIds로 최종 멤버 ID 목록을 전송한다. 리마인드 예약과 이미지 첨부는 연결되어 있다. 서버는 PDF 등 일반 파일도 허용하지만 웹 과제 작성 폼에서는 이미지만 첨부할 수 있다. 서버에서 선택 값인 제출 방법은 웹에서도 선택 입력으로 변경해야 한다."
    sources:
      - frontend/src/features/assignment/components/AssignmentFormFunnel.tsx
  x-backend:
    status: done
    owner: frombunny
    description: |
      과제를 생성하고 submitterIds를 우선하여 제출 대상을 정하며 submissionVisibility로 제출물 공개 범위를 저장한다. submissionTarget은 기존 클라이언트 호환용으로 사용한다.
      완료된 이미지·파일 첨부 연결을 지원한다.
  summary: 과제 생성
  description: 스터디 리더가 과제를 생성한다. submitterIds 또는 호환용 submissionTarget 중 하나와 submissionVisibility는 필수이며 공개 범위와 제출 대상은 서로 독립적이다. LEADER_ONLY는 리더·본인 상세 조회를 유지하고 ALL_STUDY_MEMBERS는 스터디원에게 제출 완료된 타인의 제출물 조회를 허용한다. 입력·형식 및 제목·내용·제출 방법·마감·리마인드 값 오류(400), 인증 실패(401), 접근·작성 권한 없음(403)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/assignments.yaml#/AssignmentCreateRequest' }
        example: { title: 1주 차 과제, content: 이번 주 과제를 제출해주세요., submissionMethod: 링크 제출, submitterIds: [2, 3], submissionVisibility: LEADER_ONLY, closeAt: '2099-12-31T23:59:00', remindAts: ['2099-12-30T10:00:00'] }
  responses:
    '201':
      description: 과제 생성 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignments.yaml#/AssignmentCreateResponse' }
          example: { assignmentId: 1 }
    '400': { $ref: '../../components/responses.yaml#/AssignmentWriteBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/AssignmentAttachmentForbidden' }
get:
  tags: [Assignment]
  operationId: getAssignments
  x-backend:
    status: done
    owner: frombunny
    description: |
      과제 목록을 최신순(LATEST)·마감순(DEADLINE)·미제출순(UNSUBMITTED)으로 커서 조회하고 역할별 제출 상태 집계를 반환한다. 제출 방법 필드명은 submissionMethod이다.
      가입 전 과제도 조회하며 제출 대상이 아니면 submissionStatus는 NOT_ASSIGNED이다.
      2026-10-03 변경: 본인의 상태에 LATE_SUBMITTED와 MISSING을 추가했다. 리더의 completeCount와 isComplete는 정상·지각 제출을 모두 완료로 집계한다. 관련 테스트 통과. 과제 조회의 상태 표시는 Figma에도 반영된 확정 정책이다.
  x-frontend:
    status: needs-update
    description: |
      submissionStatus의 다섯 상태를 검증하고 멤버 목록 배지에 표시한다. 대상이 아닌 과제는 이전 과제로 표시한다.
      리더 목록의 전체 완료 집계와 멤버의 개인 제출 상태를 구분한다.
      정렬 선택 UI와 sort 쿼리 연결은 아직 구현하지 않았다.
    sources:
      - frontend/src/features/assignment/components/MemberAssignmentListContent.tsx
      - frontend/src/features/assignment/responseSchemas.ts
  summary: 과제 목록 조회
  description: 가입 전 과제를 포함한 스터디 전체 과제를 커서 방식으로 조회한다. 본인의 submissionStatus는 제출 대상 여부, 현재 시각, 최초 제출 시각과 마감 시각으로 판정한다. 리더 전용 completeCount와 isComplete는 정상·지각 제출을 모두 완료에 포함하며 멤버 응답에서는 집계 필드를 생략한다. 조회로 제출 대상을 추가하지 않는다. sort를 생략하면 마감순을 적용한다. 쿼리·형식 오류(400), 인증 실패(401), 접근 권한 없음(403), 마감순·미제출순 커서 과제 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters:
    - name: sort
      in: query
      description: |
        LATEST는 ID 내림차순이다.
        DEADLINE(기본)은 현재 시각 기준 마감 전 과제를 먼저, 마감된 과제를 뒤에 표시하며 각 그룹에서 closeAt 오름차순, ID 내림차순으로 정렬한다. 마감 시각과 현재 시각이 같으면 마감 전으로 취급한다.
        UNSUBMITTED는 본인이 현재 제출 대상이며 submittedAt이 없는 과제(마감 후 미제출 포함)를 먼저, 나머지를 뒤에 표시하며 각 그룹은 ID 내림차순이다. 리더도 본인의 제출 대상 여부를 기준으로 한다.
      schema: { type: string, enum: [LATEST, DEADLINE, UNSUBMITTED], default: DEADLINE }
    - name: cursor
      in: query
      description: |
        이전 응답의 nextCursor(마지막 과제 ID). 처음 조회하거나 정렬을 변경할 때는 생략한다. 다음 페이지에서는 같은 sort를 전달한다.
        DEADLINE과 UNSUBMITTED는 해당 과제의 현재 정렬 값을 조회하여 이어 조회하므로 커서 과제가 삭제되었거나 다른 스터디에 속하면 404를 반환한다. 이 경우 커서를 생략하고 다시 조회한다.
        페이지 간 시각 경과, 마감 수정, 제출 또는 대상 변경으로 순서가 달라질 수 있으며 목록 스냅샷을 보장하지 않는다. 상태 변경 후에는 첫 페이지부터 다시 조회한다.
      schema: { type: integer, format: int64, minimum: 1 }
    - { $ref: '../../components/parameters.yaml#/Size' }
  responses:
    '200':
      description: 과제 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/assignments.yaml#/AssignmentListResponse' }
          examples:
            leader:
              summary: 리더의 전체 현황
              value: { nextCursor: null, hasNext: false, assignments: [{ id: 1, title: 1주 차 과제, content: 이번 주 과제를 제출해주세요., submissionMethod: 링크 제출, closeAt: '2026-08-29T23:59:00', memberCount: 5, completeCount: 3, remindAt: '2026-08-28T10:00:00', isComplete: false, submissionStatus: NOT_ASSIGNED, submissionVisibility: LEADER_ONLY }] }
            notAssignedMember:
              summary: 가입 전 글을 조회하는 신규 스터디원
              value: { nextCursor: null, hasNext: false, assignments: [{ id: 1, title: 가입 전 글, content: 이전 내용을 확인해주세요., submissionMethod: 링크 제출, closeAt: '2026-08-29T23:59:00', submissionStatus: NOT_ASSIGNED, submissionVisibility: LEADER_ONLY }] }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/AssignmentNotFound' }
