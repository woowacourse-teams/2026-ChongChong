post:
  tags: [File]
  operationId: createPresignedUrl
  x-frontend:
    status: needs-update
    description: |
      기능 추가: 파일 선택, 업로드 URL 발급, 필수 헤더를 포함한 S3 PUT, 업로드 완료 API 호출을 웹에 연결해야 한다.
      완료에 성공한 fileId를 공지·과제·제출물의 attachmentFileIds로 전달한다.
      공지의 COMPLETED 파일 연결은 #556으로 dev에 반영됐다.
      공지 상세 응답에 조회용 imageUrl을 추가할 예정이다(#561). 현재 OpenAPI 명세를 작성한 단계이며 백엔드 구현은 아직 반영되지 않았다.
    sources:
      - frontend/src/features/notice/components/NoticeForm.tsx
      - frontend/src/features/assignment/components/AssignmentSubmissionForm.tsx
  x-backend:
    status: done
    owner: frombunny
    description: 사용자 소유의 파일 메타데이터를 저장하고 설정한 유효기간(기본 10분)의 S3 PUT URL을 발급한다.
  summary: 파일 업로드 URL 발급
  description: |
    업로드 대기 상태의 파일을 생성한다. 반환된 uploadUrl에 요청과 같은 Content-Type으로
    파일 본문을 PUT한다. PUT 요청에는 서명에 포함된 If-None-Match: * 헤더도 반드시 보낸다.
    같은 키의 기존 파일 덮어쓰기는 거부된다. URL 발급은 실제 파일 업로드 완료를 의미하지 않는다.
    size는 클라이언트가 선언한 바이트 수이며 실제 업로드 결과는 별도로 검증해야 한다.
    공통 최대 크기는 기본 5MiB이며 FILE_UPLOAD_MAX_SIZE_BYTES로 변경할 수 있다.
    허용 MIME 유형 목록은 이 API에서 제한하지 않는다.
    S3 PUT 성공 후 POST /api/files/{fileId}/complete로 실제 파일 존재·크기 검증과 COMPLETED 전환을 요청한다.
    완료에 성공한 fileId를 공지·과제·제출물의 attachmentFileIds로 전달해 최종 첨부 목록과 순서를 지정한다.
    연결하는 API는 소유권·완료 상태·기존 연결 여부와 도메인 파일 정책을 검증한다.
    공지는 기본 최대 10장·장당 5MiB·JPEG/PNG/WebP이며 형식·용량·개수는 설정 가능하다.
    공통 용량 제한과 공지 용량 제한이 함께 적용되므로 한쪽 설정만 변경하면 다른 제한이 남을 수 있다.
    공지의 COMPLETED 파일 연결은 #556으로 dev에 반영됐다. 과제·제출물도 완료 파일 연결을 지원한다.
    조회용 imageUrl은 #561에서 공지 상세 응답에 추가하는 계약을 선행 반영했으며 백엔드 구현은 진행 중이다.
    조회 URL은 공통 유효기간 설정을 따르며 만료되면 공지 상세를 다시 조회해 갱신한다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [originalFileName, contentType, size]
          properties:
            originalFileName: { type: string, minLength: 1, maxLength: 255, description: 원본 파일명. 공백만 있는 값은 허용하지 않는다. }
            contentType: { type: string, minLength: 1, maxLength: 255, description: PUT 요청에도 사용할 Content-Type. 공백만 있는 값은 허용하지 않는다. }
            size: { type: integer, format: int64, minimum: 0 }
  responses:
    '201':
      description: 업로드 대기 파일 생성 및 URL 발급 성공
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [fileId, uploadUrl, expiresAt]
            properties:
              fileId: { type: integer, format: int64 }
              uploadUrl: { type: string, format: uri }
              expiresAt: { type: string, format: date-time }
    '400':
      description: 입력 형식 오류 또는 공통 최대 파일 크기 초과
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '../../components/schemas/errors.yaml#/InvalidInputValueError' }
              - { $ref: '../../components/schemas/errors.yaml#/InvalidRequestError' }
              - type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, const: INVALID_FILE_SIZE }
                  message: { type: string, const: 파일 크기가 올바르지 않습니다. }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }
    '500':
      description: URL 발급 실패 등 서버 오류. 파일 메타데이터 저장은 롤백된다.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: { type: string, const: INTERNAL_SERVER_ERROR }
              message: { type: string }
