post:
  tags: [Web Push]
  operationId: registerWebPushSubscription
  x-frontend:
    description: |
      브라우저 프로필에서 생성·보관하는 installationId와 Service Worker의 PushSubscription JSON(endpoint, keys.p256dh, keys.auth)을
      로그인한 사용자의 구독으로 등록한다. 같은 사용자와 installationId를 다시 등록하면 endpoint와 키를 갱신하고 기존 구독을 활성화한다.
      installationId는 사용자별로 관리되므로 같은 브라우저 프로필을 다른 사용자도 등록할 수 있다.
  x-backend:
    status: done
    owner: wontop02
    description: userId와 installationId를 복합 유일 키로 사용해 같은 사용자의 구독을 upsert한다. endpoint와 암호화 키는 재등록 시 갱신한다.
  summary: Web Push 구독 등록
  description: 현재 사용자의 브라우저 Web Push 구독을 등록하거나 갱신한다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/web-push-subscriptions.yaml#/WebPushSubscriptionRegisterRequest' }
        example:
          installationId: 4c2f0b3f-0a57-4a37-bb15-8ad7f4f3c2a1
          endpoint: 'https://push.example.com/subscription'
          keys: { p256dh: p256dh-key, auth: auth-secret }
  responses:
    '200':
      description: Web Push 구독 등록 성공.
      content:
        application/json:
          schema: { $ref: '../../components/schemas/web-push-subscriptions.yaml#/WebPushSubscriptionRegisterResponse' }
    '400': { $ref: '../../components/responses.yaml#/InvalidInputAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404': { $ref: '../../components/responses.yaml#/UserNotFound' }
