delete:
  tags: [Web Push]
  operationId: deactivateWebPushSubscription
  x-frontend:
    description: |
      로그아웃 등 현재 브라우저의 알림 수신을 중단할 때 등록 응답으로 받은 subscriptionId를 사용한다.
      성공은 본문 없는 204이다.
  x-backend:
    status: done
    owner: wontop02
    description: 현재 사용자의 subscriptionId에 해당하는 Web Push 구독만 비활성화한다.
  summary: Web Push 구독 비활성화
  description: 현재 사용자의 Web Push 구독을 비활성화한다. 등록 정보가 없거나 다른 사용자의 구독이면 변경 없이 204를 반환한다.
  security: [{ bearerAuth: [] }]
  parameters:
    - { $ref: '../../components/parameters.yaml#/SubscriptionId' }
  responses:
    '204': { description: Web Push 구독 비활성화 성공. 응답 본문 없음. }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
