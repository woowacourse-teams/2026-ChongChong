get:
  tags: [Study]
  operationId: getInviteLink
  summary: 스터디 초대 링크 조회
  description: 유효한 스터디 멤버가 참여용 초대 링크를 조회한다. 경로 오류(400), 인증 실패(401), 접근 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '../../components/parameters.yaml#/StudyId' }]
  responses:
    '200':
      description: 초대 링크 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/studies.yaml#/StudyInviteLinkResponse' }
          example: { inviteLink: 'https://chongchong.app/studies/join?token=eyJ...' }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/StudyNotFound' }
