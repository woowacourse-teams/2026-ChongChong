get:
  tags: [Study]
  operationId: getStudyInfo
  x-frontend:
    status: needs-update
    description: "studyName·role·userName 조회는 연동되어 있다. 수정 화면의 현재 이미지 표시를 위해 응답 타입·검증 스키마와 미리보기에 imageUrl 연결이 필요하다."
    sources:
      - frontend/src/features/study/api.ts
      - frontend/src/features/study/pages/StudyDetailPage.tsx
      - frontend/src/features/study/pages/StudyEditPage.tsx
  x-backend:
    status: done
    owner: wontop02
    description: |
      스터디 이름·설명·공개 여부·이미지 조회 URL과 요청자의 역할을 조회한다. 스터디 구성원만 조회할 수 있다.
  summary: 스터디 기본 정보 조회
  description: 스터디 이름·설명·공개 여부·이미지 조회 URL과 사용자의 역할을 조회한다. 설명과 imageUrl은 null일 수 있다. 경로 오류(400), 인증 실패(401), 접근 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  parameters: [{ $ref: '../../components/parameters.yaml#/StudyId' }]
  responses:
    '200':
      description: 스터디 기본 정보 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/studies.yaml#/StudyInfoResponse' }
          example: { studyName: 자바 스터디, description: 매주 월요일에 진행한다., role: LEADER, userName: 홍길동, isPublic: false, imageUrl: 'https://example.com/study.png' }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/StudyAccessDenied' }
    '404': { $ref: '../../components/responses.yaml#/StudyNotFound' }
