get:
  tags: [Study]
  operationId: getMyStudies
  summary: 내 스터디 목록 조회
  description: 인증된 사용자가 가입한 모든 스터디와 집계 정보를 조회한다.
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: 내 스터디 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/studies.yaml#/MyStudyListResponse' }
          example: { studyCount: 1, studies: [{ id: 1, role: MEMBER, name: 자바 스터디, description: 매주 월요일에 진행한다., memberCount: 5, noticeCount: 3, assignmentCount: 4 }] }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
