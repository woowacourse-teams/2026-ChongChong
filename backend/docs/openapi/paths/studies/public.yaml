get:
  tags: [Study]
  operationId: getPublicStudies
  x-backend:
    status: review
    owner: wontop02
    description: |
      공개 스터디의 최신순 커서 조회와 요약 응답을 구현했다. HTTP 인수 테스트로 공개 조건·정렬·커서 페이징과 JSON 응답 계약을 검증한다.
  summary: 공개 스터디 목록 조회
  description: |
    인증된 사용자가 isPublic=true인 스터디를 생성 시각 내림차순으로 조회한다. 생성 시각이 같으면 스터디 ID 내림차순으로 정렬한다.
    현재 구현은 사용자의 가입 여부로 목록을 필터링하지 않는다. 요청 본문은 사용하지 않는다.

    첫 요청에서는 cursor를 생략하고, 다음 요청에는 직전 응답의 nextCursor를 전달한다.
    커서는 스터디 ID이며 서버는 해당 스터디의 생성 시각과 ID를 기준으로 다음 목록을 조회한다.
    hasNext=false이면 마지막 페이지이며 nextCursor는 null이다. 조회 결과가 없으면 studies는 빈 배열이다.
    cursor가 가리키는 스터디가 삭제되었거나 존재하지 않으면 STUDY_NOT_FOUND(404)를 반환한다.
  security: [{ bearerAuth: [] }]
  parameters:
    - $ref: '../../components/parameters.yaml#/Cursor'
      description: 직전 응답의 nextCursor인 스터디 ID. 첫 요청에서는 생략한다.
    - { $ref: '../../components/parameters.yaml#/Size' }
  responses:
    '200':
      description: 공개 스터디 목록 조회 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/studies.yaml#/StudyListResponse' }
          examples:
            hasNextPage:
              summary: size=2이며 다음 페이지가 있는 목록
              value:
                nextCursor: 17
                hasNext: true
                studies:
                  - { studyId: 21, studyName: 자바 스터디, description: 매주 월요일에 진행한다., imageUrl: 'https://example.com/study.png', memberCount: 5 }
                  - { studyId: 17, studyName: 알고리즘 스터디, description: 함께 문제를 풉니다., imageUrl: null, memberCount: 3 }
            lastPage:
              summary: 마지막 페이지
              value:
                nextCursor: null
                hasNext: false
                studies:
                  - { studyId: 4, studyName: 독서 스터디, description: null, imageUrl: null, memberCount: 1 }
            empty:
              summary: 조회할 공개 스터디가 없는 경우
              value: { nextCursor: null, hasNext: false, studies: [] }
    '400': { $ref: '../../components/responses.yaml#/InvalidParameterAndRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '404':
      description: 사용자 또는 cursor가 가리키는 스터디가 존재하지 않음
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '../../components/schemas/errors.yaml#/UserNotFoundError' }
              - { $ref: '../../components/schemas/errors.yaml#/StudyNotFoundError' }
          examples:
            cursorStudyNotFound:
              summary: 커서 스터디가 존재하지 않음
              value: { code: STUDY_NOT_FOUND, message: 존재하지 않는 스터디입니다. }
            userNotFound:
              summary: 사용자가 존재하지 않음
              value: { code: USER_NOT_FOUND, message: 해당 사용자를 찾을 수 없습니다. }
