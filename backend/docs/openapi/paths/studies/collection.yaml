post:
  tags: [Study]
  operationId: createStudy
  x-frontend:
    status: integrated
    description: "name·description을 전송하고 studyId 응답으로 생성 후 이동한다."
    sources:
      - frontend/src/features/study/api.ts
      - frontend/src/features/study/pages/CreateStudyPage.tsx
  x-backend:
    status: done
    owner: wontop02
    description: |
      스터디와 리더 멤버십을 생성한다. 생성·참여 동시 요청에도 사용자별 가입 상한을 적용한다.
  summary: 스터디 생성
  description: |
    인증된 사용자가 공개 여부를 포함해 새 스터디를 생성한다. imageFileId를 전달하면 업로드 완료된 이미지를 연결하며,
    생략하거나 null이면 이미지 없이 생성한다. isPublic 생략·null이나 이미지 정책 위반은 400, 이미지 파일 소유자가
    아니면 403, 사용자 또는 파일이 없으면 404, 가입 스터디 상한 초과는 409를 반환할 수 있다.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: '../../components/schemas/studies.yaml#/StudyCreateRequest' }
        example: { name: 자바 스터디, description: 매주 월요일에 진행한다., isPublic: true, imageFileId: 101 }
  responses:
    '201':
      description: 스터디 생성 성공
      content:
        application/json:
          schema: { $ref: '../../components/schemas/studies.yaml#/StudyCreateResponse' }
          example: { studyId: 1 }
    '400': { $ref: '../../components/responses.yaml#/StudyCreateBadRequest' }
    '401': { $ref: '../../components/responses.yaml#/AuthenticationRequired' }
    '403': { $ref: '../../components/responses.yaml#/FileNotOwned' }
    '404': { $ref: '../../components/responses.yaml#/UserOrFileNotFound' }
    '409': { $ref: '../../components/responses.yaml#/JoinedStudyLimitExceeded' }
