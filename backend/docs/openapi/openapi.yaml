        '403':
          description: 스터디 접근 권한이 없음
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/StudyAccessDeniedError' }
              example: { code: STUDY_ACCESS_DENIED, message: 해당 스터디에 대한 접근 권한이 없습니다. }
        '404':
          description: 공지 또는 공지 수신자 정보가 없음
          content:
            application/json:
              schema: { oneOf: [{ $ref: './components.yaml#/components/schemas/NoticeNotFoundError' }, { $ref: './components.yaml#/components/schemas/NoticeRecipientNotFoundError' }] }
              examples:
                noticeNotFound: { value: { code: NOTICE_NOT_FOUND, message: 존재하지 않는 공지입니다. } }
