openapi: 3.1.0
info:
  title: 총총 API
  version: 1.0.0
  description: |
    총총 서비스의 사전 설계 API 계약이다. 이 파일과 `paths/`, `components/`의 YAML 파일이 명세의 원본이며,
    구현 코드와 분리해 관리한다. 모든 응답 객체는 명시된 필드 외의 추가 필드를 허용하지 않는다.

    2026-10-19 기준 커밋 c9884a248113b56b0db84adbea31d36d0a3a136e의 구현과 대조했다.
    웹 미연동 기능과 입력·응답 제약 차이는 API별 프론트 안내에 표시한다. 구현 상태는 운영 배포 여부를 뜻하지 않는다.

    [백엔드 개발 보드](board.html)에서 API별 진행 상태, 담당자와 개발 설명을 확인할 수 있다.
servers:
  - url: /
tags:
  - { name: Auth, description: 인증 API }
  - { name: User, description: 사용자 API }
  - { name: Study, description: 스터디 API }
  - { name: Study Member, description: 스터디 멤버 API }
  - { name: Notice, description: 공지 API }
  - { name: Assignment, description: 과제 API }
  - { name: Assignment Submission, description: 과제 제출물 API }
  - { name: Comment, description: 공지·과제·제출물 댓글 API. 대상별 구현 상태는 각 operation의 x-backend를 따른다. }
  - { name: Web Push, description: Web Push 구독 API }
  - { name: Notification, description: 알림 API }
  - { name: File, description: 파일 업로드 API }

