        - { $ref: './components.yaml#/components/parameters/NoticeId' }
      responses:
        '200':
          description: 공지 읽음 처리 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/NoticeReadResponse' }
              example: { readAt: '2026-08-24T02:09:18.441601' }
        '400':
          description: 요청 형식이 잘못됨
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/InvalidRequestError' }
              example: { code: INVALID_REQUEST, message: 요청 형식이 잘못되었습니다. }
