openapi: 3.1.0
info:
  title: 총총 API
  version: 1.0.0
  description: |
    총총 서비스의 사전 설계 API 계약이다. 이 파일과 `components.yaml`이 명세의 원본이며,
    구현 코드와 분리해 관리한다. 모든 응답 객체는 명시된 필드 외의 추가 필드를 허용하지 않는다.
servers:
  - url: /
tags:
  - { name: Auth, description: 인증 API }
  - { name: Study, description: 스터디 API }
  - { name: Study Member, description: 스터디 멤버 API }
  - { name: Notice, description: 공지 API }
  - { name: Assignment, description: 과제 API }
  - { name: Assignment Submission, description: 과제 제출물 API }
  - { name: Push Token, description: 푸시 토큰 API }

paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      operationId: csrf
      summary: CSRF 토큰 조회
      description: 웹 인증 요청에 사용할 CSRF 토큰을 조회한다. 응답과 함께 XSRF-TOKEN 쿠키가 발급된다.
      security: []
      responses:
        '200':
          description: CSRF 토큰 조회 성공
          headers:
            Set-Cookie:
              description: 이후 웹 인증 요청에 사용할 XSRF-TOKEN 쿠키
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/WebCsrfTokenResponse' }
              example: { headerName: X-XSRF-TOKEN, token: csrf-token }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 소셜 로그인
      security: []
      description: |
        소셜 로그인 인가 코드로 액세스 토큰을 발급하고 Refresh Token은 HttpOnly 쿠키로 발급한다.
        오류: 입력 검증/형식 오류(400), 지원하지 않는 제공자(400), CSRF 불일치(403),
        소셜 인증 실패(401), 사용자 없음(404).
      parameters:
        - { name: X-XSRF-TOKEN, in: header, required: true, description: CSRF 토큰, schema: { type: string }, example: csrf-token }
        - { name: XSRF-TOKEN, in: cookie, required: true, description: CSRF 쿠키, schema: { type: string }, example: csrf-token }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components.yaml#/components/schemas/SocialLoginRequest' }
            example: { provider: KAKAO, authorizationCode: authorization-code-from-provider }
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie: { description: HttpOnly Refresh Token 쿠키, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/SocialLoginResponse' }
              example: { tokenType: Bearer, accessToken: eyJhbGciOiJIUzI1NiJ9..., accessTokenExpiresAt: '2026-08-27T12:00:00Z' }
        '400': { $ref: './components.yaml#/components/responses/LoginBadRequest' }
        '401': { $ref: './components.yaml#/components/responses/SocialAuthenticationFailed' }
        '403': { $ref: './components.yaml#/components/responses/InvalidCsrfToken' }
        '404': { $ref: './components.yaml#/components/responses/UserNotFound' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: 액세스 토큰 갱신
      security: []
      description: Refresh Token 쿠키를 회전시키고 새 액세스 토큰을 발급한다. 요청 형식 오류(400), 유효하지 않은 Refresh Token(401), CSRF 불일치(403)를 반환할 수 있다.
      parameters:
        - { name: X-XSRF-TOKEN, in: header, required: true, description: CSRF 토큰, schema: { type: string }, example: csrf-token }
        - { name: XSRF-TOKEN, in: cookie, required: true, description: CSRF 쿠키, schema: { type: string }, example: csrf-token }
        - { name: refresh_token, in: cookie, required: true, description: 로그인 시 발급된 Refresh Token 쿠키, schema: { type: string }, example: refresh-token }
      responses:
        '200':
          description: 토큰 갱신 성공
          headers:
            Set-Cookie: { description: 회전된 HttpOnly Refresh Token 쿠키, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/SocialLoginResponse' }
              example: { tokenType: Bearer, accessToken: eyJhbGciOiJIUzI1NiJ9..., accessTokenExpiresAt: '2026-08-27T12:00:00Z' }
        '400': { $ref: './components.yaml#/components/responses/InvalidRequestOnly' }
        '401': { $ref: './components.yaml#/components/responses/InvalidRefreshToken' }
        '403': { $ref: './components.yaml#/components/responses/InvalidCsrfToken' }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃
      security: []
      description: Refresh Token이 있으면 폐기하고 인증 쿠키를 만료시킨다. Refresh Token 쿠키가 없어도 성공하며 CSRF 불일치 시 403을 반환한다.
      parameters:
        - { name: X-XSRF-TOKEN, in: header, required: true, description: CSRF 토큰, schema: { type: string }, example: csrf-token }
        - { name: XSRF-TOKEN, in: cookie, required: true, description: CSRF 쿠키, schema: { type: string }, example: csrf-token }
        - { name: refresh_token, in: cookie, required: false, description: 폐기할 Refresh Token 쿠키, schema: { type: string }, example: refresh-token }
      responses:
        '204':
          description: 로그아웃 성공. 응답 본문 없음.
          headers:
            Set-Cookie: { description: 즉시 만료된 Refresh Token 쿠키, schema: { type: string } }
        '403': { $ref: './components.yaml#/components/responses/InvalidCsrfToken' }

  /api/studies:
    post:
      tags: [Study]
      operationId: createStudy
      summary: 스터디 생성
      description: 인증된 사용자가 새 스터디를 생성한다. 입력 오류(400), 인증 실패(401), 사용자 없음(404), 가입 스터디 상한 초과(409)를 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components.yaml#/components/schemas/StudyCreateRequest' }
            example: { name: 자바 스터디, description: 매주 월요일에 진행한다. }
      responses:
        '201':
          description: 스터디 생성 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/StudyCreateResponse' }
              example: { studyId: 1 }
        '400': { $ref: './components.yaml#/components/responses/InvalidInputAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '404': { $ref: './components.yaml#/components/responses/UserNotFound' }
        '409': { $ref: './components.yaml#/components/responses/JoinedStudyLimitExceeded' }

  /api/studies/{studyId}:
    parameters:
      - { $ref: './components.yaml#/components/parameters/StudyId' }
    get:
      tags: [Study]
      operationId: getStudyDetail
      summary: 스터디 상세 조회
      description: 사용자의 역할에 맞는 스터디 상세를 조회한다. 리더는 전체 현황을, 멤버는 미확인·미제출 항목을 받는다. 경로 오류(400), 인증 실패(401), 접근 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 스터디 상세 조회 성공
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: './components.yaml#/components/schemas/LeaderStudyDetailResponse' }
                  - { $ref: './components.yaml#/components/schemas/MemberStudyDetailResponse' }
              examples:
                leader: { value: { notices: { count: 1, items: [{ id: 1, title: 이번 주 공지, memberCount: 5, completeCount: 3 }] }, assignments: { count: 1, items: [{ id: 1, title: 1주 차 과제, memberCount: 5, completeCount: 3 }] } } }
                member: { value: { totalCount: 2, notices: { items: [{ id: 1, title: 이번 주 공지 }] }, assignments: { items: [{ id: 1, title: 1주 차 과제 }] } } }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/StudyAccessDenied' }
        '404': { $ref: './components.yaml#/components/responses/StudyNotFound' }
    patch:
      tags: [Study]
      operationId: updateStudy
      summary: 스터디 수정
      description: 스터디 리더가 이름과 설명을 부분 수정한다. 입력·경로 오류(400), 인증 실패(401), 접근 또는 리더 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components.yaml#/components/schemas/StudyUpdateRequest' }
            example: { name: 수정된 스터디, description: 매주 화요일에 진행한다. }
      responses:
        '204': { description: 스터디 수정 성공. 응답 본문 없음. }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/StudyAccessOrLeaderDenied' }
        '404': { $ref: './components.yaml#/components/responses/StudyNotFound' }
    delete:
      tags: [Study]
      operationId: deleteStudy
      summary: 스터디 삭제
      description: 스터디 리더가 스터디와 종속 데이터를 삭제한다. 경로 오류(400), 인증 실패(401), 접근 또는 리더 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 스터디 삭제 성공. 응답 본문 없음. }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/StudyAccessOrLeaderDenied' }
        '404': { $ref: './components.yaml#/components/responses/StudyNotFound' }

  /api/studies/{studyId}/info:
    get:
      tags: [Study]
      operationId: getStudyInfo
      summary: 스터디 기본 정보 조회
      description: 사용자의 스터디 역할과 기본 정보를 조회한다. 경로 오류(400), 인증 실패(401), 접근 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './components.yaml#/components/parameters/StudyId' }]
      responses:
        '200':
          description: 스터디 기본 정보 조회 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/StudyInfoResponse' }
              example: { studyName: 자바 스터디, role: LEADER, userName: 홍길동 }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/StudyAccessDenied' }
        '404': { $ref: './components.yaml#/components/responses/StudyNotFound' }

  /api/studies/me:
    get:
      tags: [Study]
      operationId: getMyStudies
      summary: 내 스터디 목록 조회
      description: 인증된 사용자가 가입한 모든 스터디와 집계 정보를 조회한다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 스터디 목록 조회 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/MyStudyListResponse' }
              example: { studyCount: 1, studies: [{ id: 1, role: MEMBER, name: 자바 스터디, description: 매주 월요일에 진행한다., memberCount: 5, noticeCount: 3, assignmentCount: 4 }] }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }

  /api/studies/{studyId}/invite-link:
    get:
      tags: [Study]
      operationId: getInviteLink
      summary: 스터디 초대 링크 조회
      description: 유효한 스터디 멤버가 참여용 초대 링크를 조회한다. 경로 오류(400), 인증 실패(401), 접근 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './components.yaml#/components/parameters/StudyId' }]
      responses:
        '200':
          description: 초대 링크 조회 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/StudyInviteLinkResponse' }
              example: { inviteLink: 'https://chongchong.app/studies/join?token=eyJ...' }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/StudyAccessDenied' }
        '404': { $ref: './components.yaml#/components/responses/StudyNotFound' }

  /api/studies/join:
    post:
      tags: [Study Member]
      operationId: join
      summary: 스터디 참여
      description: 초대 토큰으로 스터디에 참여한다. 입력·초대 토큰 오류(400), 인증 실패(401), 사용자·스터디 없음(404), 이미 참여·정원·가입 상한 충돌(409)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components.yaml#/components/schemas/StudyInviteTokenRequest' }
            example: { token: eyJhbGciOiJIUzI1NiJ9... }
      responses:
        '201':
          description: 스터디 참여 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/StudyMemberJoinResponse' }
              example: { studyId: 1 }
        '400': { $ref: './components.yaml#/components/responses/JoinBadRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '404':
          description: 사용자 또는 스터디가 존재하지 않음
          content:
            application/json:
              schema: { oneOf: [{ $ref: './components.yaml#/components/schemas/UserNotFoundError' }, { $ref: './components.yaml#/components/schemas/StudyNotFoundError' }] }
        '409': { $ref: './components.yaml#/components/responses/JoinConflict' }

  /api/studies/{studyId}/members:
    get:
      tags: [Study Member]
      operationId: getAllStudyMembers
      summary: 스터디 멤버 목록 조회
      description: 스터디 멤버 목록을 조회한다. 경로 오류(400), 인증 실패(401), 접근 권한 없음(403), 스터디 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './components.yaml#/components/parameters/StudyId' }]
      responses:
        '200':
          description: 멤버 목록 조회 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/StudyMembersResponse' }
              example: { members: [{ id: 1, name: 홍길동, profileImage: 'https://example.com/profile.png', role: LEADER }] }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/StudyAccessDenied' }
        '404': { $ref: './components.yaml#/components/responses/StudyNotFound' }

  /api/studies/{studyId}/members/{memberId}:
    delete:
      tags: [Study Member]
      operationId: expel
      summary: 스터디 멤버 방출
      description: 리더가 다른 멤버를 방출한다. 경로 오류(400), 인증 실패(401), 접근·리더 권한 없음 또는 리더 방출 시도(403), 멤버 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: './components.yaml#/components/parameters/StudyId' }
        - { $ref: './components.yaml#/components/parameters/MemberId' }
      responses:
        '204': { description: 멤버 방출 성공. 응답 본문 없음. }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/ExpelForbidden' }
        '404': { $ref: './components.yaml#/components/responses/StudyMemberNotFound' }

  /api/studies/{studyId}/members/me:
    delete:
      tags: [Study Member]
      operationId: leave
      summary: 스터디 탈퇴
      description: 현재 멤버가 스터디에서 탈퇴한다. 경로 오류(400), 인증 실패(401), 접근 권한 없음 또는 리더의 탈퇴 시도(403)를 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './components.yaml#/components/parameters/StudyId' }]
      responses:
        '204': { description: 스터디 탈퇴 성공. 응답 본문 없음. }
        '400': { $ref: './components.yaml#/components/responses/InvalidParameterAndRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/LeaveForbidden' }

  /api/studies/{studyId}/notices:
    parameters:
      - { $ref: './components.yaml#/components/parameters/StudyId' }
    post:
      tags: [Notice]
      operationId: createNotice
      summary: 공지 생성
      description: 스터디 리더가 공지를 생성한다. 입력·형식·도메인 값 오류(400), 인증 실패(401), 접근·작성 권한 없음(403)을 반환할 수 있다. 리마인드 시각은 현재보다 미래여야 한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './components.yaml#/components/schemas/NoticeCreateRequest' }
            example: { title: 이번 주 공지, content: 이번 주 스터디 일정을 확인해주세요., remindAts: ['2026-08-28T10:00:00'] }
      responses:
        '201':
          description: 공지 생성 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/NoticeCreateResponse' }
              example: { noticeId: 1 }
        '400': { $ref: './components.yaml#/components/responses/NoticeWriteBadRequest' }
        '401': { $ref: './components.yaml#/components/responses/AuthenticationRequired' }
        '403': { $ref: './components.yaml#/components/responses/StudyAccessOrActionDenied' }
    get:
      tags: [Notice]
      operationId: getNotices
      summary: 공지 목록 조회
      description: 역할에 맞는 공지 목록을 커서 방식으로 조회한다. 리더 전용 집계 필드는 멤버 응답에서 null이다. 쿼리·형식 오류(400), 인증 실패(401), 접근 권한 없음(403), 수신자 정보 없음(404)을 반환할 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: './components.yaml#/components/parameters/Cursor' }
        - { $ref: './components.yaml#/components/parameters/Size' }
      responses:
        '200':
          description: 공지 목록 조회 성공
          content:
            application/json:
              schema: { $ref: './components.yaml#/components/schemas/NoticeListResponse' }
              example: { nextCursor: null, hasNext: false, notices: [{ id: 1, title: 이번 주 공지, content: 이번 주 스터디 일정을 확인해주세요., createdAt: '2026-08-27T10:00:00', recipientCount: 5, readRecipientCount: 3, remindAt: '2026-08-28T10:00:00', isComplete: false }] }
