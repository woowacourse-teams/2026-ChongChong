CommentFocusId:
  name: focusCommentId
  in: query
  required: false
  description: 같은 원문의 해당 댓글을 포함하여 이후 댓글을 조회한다. cursor와 함께 지정할 수 없다.
  schema: { type: integer, format: int64, minimum: 1 }
  example: 42
