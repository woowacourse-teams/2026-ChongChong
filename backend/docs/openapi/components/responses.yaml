      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/InvalidInputValueError' }, { $ref: './schemas/errors.yaml#/InvalidRequestError' }, { $ref: './schemas/errors.yaml#/InvalidStudyIdError' }, { $ref: './schemas/errors.yaml#/InvalidInviteTokenError' }] }
