  content:
    application/json:
      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/StudyAccessDeniedError' }, { $ref: './schemas/errors.yaml#/AccessDeniedError' }, { $ref: './schemas/errors.yaml#/FileNotOwnedError' }] }
FileNotFound:
