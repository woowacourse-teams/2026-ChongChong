    application/json:
      schema: { oneOf: [{ $ref: './schemas/assignment-attachments.yaml#/AttachmentBadRequest' }, { $ref: './schemas/errors.yaml#/InvalidInputValueError' }, { $ref: './schemas/errors.yaml#/InvalidRequestError' }, { $ref: './schemas/errors.yaml#/AssignmentInvalidContentError' }, { $ref: './schemas/errors.yaml#/InvalidLinkError' }] }
