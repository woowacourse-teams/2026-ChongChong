  content: { application/json: { schema: { $ref: './schemas/errors.yaml#/InvalidRequestError' } } }
LoginBadRequest:
  description: 입력값 검증 실패, 요청 형식 오류 또는 지원하지 않는 소셜 로그인 제공자
  content:
    application/json:
      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/InvalidInputValueError' }, { $ref: './schemas/errors.yaml#/InvalidRequestError' }, { $ref: './schemas/errors.yaml#/UnsupportedSocialProviderError' }] }
NoticeWriteBadRequest:
  description: |
    입력값·요청 형식·공지 필드·첨부 식별자·이미지 형식·용량·개수 규칙 위반.
    신규 첨부가 PENDING·DELETE_PENDING이거나 이미 공지·과제·제출물에 연결된 경우 FILE_NOT_ATTACHABLE을 반환한다.
  content:
    application/json:
      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/InvalidInputValueError' }, { $ref: './schemas/errors.yaml#/InvalidRequestError' }, { $ref: './schemas/errors.yaml#/NoticeInvalidTitleError' }, { $ref: './schemas/errors.yaml#/NoticeInvalidContentError' }, { $ref: './schemas/errors.yaml#/InvalidRemindAtError' }, { $ref: './schemas/errors.yaml#/NoticeAttachmentBadRequestError' }] }
