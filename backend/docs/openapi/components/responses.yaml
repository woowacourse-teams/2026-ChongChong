  content:
    application/json:
      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/InvalidInputValueError' }, { $ref: './schemas/errors.yaml#/InvalidRequestError' }, { $ref: './schemas/errors.yaml#/StudyImageBadRequestError' }] }
InvalidParameterAndRequest:
