  content:
    application/json:
      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/UserNotFoundError' }, { $ref: './schemas/errors.yaml#/FileNotFoundError' }] }
StudyOrFileNotFound:
  description: 스터디 또는 첨부할 파일 메타데이터가 존재하지 않음
  content:
    application/json:
      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/StudyNotFoundError' }, { $ref: './schemas/errors.yaml#/FileNotFoundError' }] }
NoticeOrFileNotFound:
  description: 공지 또는 첨부할 파일 메타데이터가 존재하지 않음
  content:
    application/json:
      schema: { oneOf: [{ $ref: './schemas/errors.yaml#/NoticeNotFoundError' }, { $ref: './schemas/errors.yaml#/FileNotFoundError' }] }
