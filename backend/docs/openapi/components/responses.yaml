CommentListBadRequest:
  description: 경로·쿼리 형식 오류, 양수가 아닌 ID 또는 cursor와 focusCommentId 동시 지정
  content:
    application/json:
      schema:
        oneOf:
          - { $ref: './schemas/errors.yaml#/InvalidRequestParameterError' }
          - { $ref: './schemas/errors.yaml#/InvalidRequestError' }
          - { $ref: './schemas/comments.yaml#/CommentInvalidPageRequestError' }
CommentWriteBadRequest:
  description: 경로·요청 형식 오류, 필수 본문 누락 또는 정규화 후 본문 길이·공백 규칙 위반
  content:
    application/json:
      schema:
        oneOf:
          - { $ref: './schemas/errors.yaml#/InvalidInputValueError' }
          - { $ref: './schemas/errors.yaml#/InvalidRequestParameterError' }
          - { $ref: './schemas/errors.yaml#/InvalidRequestError' }
          - { $ref: './schemas/comments.yaml#/CommentInvalidContentError' }
CommentMutationForbidden:
  description: 댓글 수정은 작성자 본인만 가능하며 삭제는 작성자 본인 또는 해당 스터디의 현재 리더만 가능
  content: { application/json: { schema: { $ref: './schemas/errors.yaml#/AccessDeniedError' } } }
NoticeCommentNotFound:
