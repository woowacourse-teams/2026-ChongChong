  content: { application/json: { schema: { $ref: './schemas/comments.yaml#/CommentStateChangedError' } } }
SubmissionCommentConflict:
  description: 실제 제출 전이거나 공유 잠그지 않은 새 수신 후보·잠금 경합으로 댓글 쓰기가 취소됨
  content:
    application/json:
      schema:
        oneOf:
          - { $ref: './schemas/comments.yaml#/CommentTargetNotReadyError' }
          - { $ref: './schemas/comments.yaml#/CommentStateChangedError' }
InvalidInputAndRequest:
  description: 입력값 검증에 실패했거나 요청 JSON 형식이 잘못됨
