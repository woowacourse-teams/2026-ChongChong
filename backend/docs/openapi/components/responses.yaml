  content:
    application/json:
      schema:
        oneOf:
          - { $ref: './schemas/errors.yaml#/StudyNotFoundError' }
          - { $ref: './schemas/errors.yaml#/NoticeNotFoundError' }
          - { $ref: './schemas/errors.yaml#/UserNotFoundError' }
          - { $ref: './schemas/comments.yaml#/CommentNotFoundError' }
AssignmentCommentNotFound:
  description: 스터디·과제·사용자가 없거나 경로에 속한 댓글을 찾을 수 없음
  content:
    application/json:
      schema:
        oneOf:
          - { $ref: './schemas/errors.yaml#/StudyNotFoundError' }
          - { $ref: './schemas/errors.yaml#/AssignmentNotFoundError' }
          - { $ref: './schemas/errors.yaml#/UserNotFoundError' }
          - { $ref: './schemas/comments.yaml#/CommentNotFoundError' }
SubmissionCommentNotFound:
  description: 스터디·과제·제출물·사용자가 없거나 경로에 속한 댓글을 찾을 수 없음
  content:
    application/json:
      schema:
        oneOf:
          - { $ref: './schemas/errors.yaml#/StudyNotFoundError' }
          - { $ref: './schemas/errors.yaml#/AssignmentNotFoundError' }
          - { $ref: './schemas/errors.yaml#/AssignmentSubmissionNotFoundError' }
          - { $ref: './schemas/errors.yaml#/UserNotFoundError' }
          - { $ref: './schemas/comments.yaml#/CommentNotFoundError' }
CommentStateChanged:
