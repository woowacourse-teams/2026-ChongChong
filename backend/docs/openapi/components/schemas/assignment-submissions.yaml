AssignmentSubmissionStatusResponse:
  type: object
  additionalProperties: false
  required: [id, memberCount, completeCount, incompleteCount, remindAt, completeMembers, incompleteMembers]
  properties:
    id: { type: integer, format: int64, example: 1 }
    memberCount: { type: integer, example: 5 }
    completeCount: { type: integer, example: 3 }
    incompleteCount: { type: integer, example: 2 }
    remindAt:
      description: 대기 중인 리마인더의 가장 이른 예약 시각. 예약이 없으면 목록에서는 생략하고 현황 응답에서는 null을 반환한다.
      oneOf: [{ $ref: './common.yaml#/LocalDateTime' }, { type: 'null' }]
    completeMembers: { type: array, items: { $ref: '#/CompleteMember' } }
    incompleteMembers: { type: array, items: { $ref: './notices.yaml#/UnreadMember' } }
AssignmentSubmitRequest:
  type: object
  additionalProperties: false
  properties:
    content: { description: "과제 답안 또는 제출 내용을 설명하는 텍스트. 수정 요청에서는 생략하거나 null이면 기존 값을 유지한다.", type: [string, 'null'], maxLength: 10000, example: 이번 주 과제를 완료했습니다. }
    link: { description: "과제 결과물을 확인할 수 있는 링크. 수정 요청에서는 생략하거나 null이면 기존 값을 유지한다.", type: [string, 'null'], maxLength: 10000, example: 'https://github.com/example/project' }
AssignmentSubmitResponse:
  type: object
  additionalProperties: false
  required: [submissionId]
  properties:
    submissionId: { type: integer, format: int64, example: 1 }
MySubmissionDetailResponse:
  type: object
  additionalProperties: false
  required: [submissionStatus]
  properties:
    submissionId: { type: integer, format: int64, example: 1 }
    submissionStatus: { $ref: '#/SubmissionStatus' }
    createdAt:
      $ref: './common.yaml#/LocalDateTime'
    content: { type: string, example: 이번 주 과제를 완료했습니다. }
    link: { type: string, example: 'https://github.com/example/project' }
SubmissionDetailResponse:
  type: object
  additionalProperties: false
  required: [id, name, profileImage, createdAt, content, link]
  properties:
    id: { type: integer, format: int64, example: 1 }
    name: { type: string, example: 홍길동 }
    profileImage: { type: [string, 'null'], example: 'https://example.com/profile.png' }
    createdAt:
      description: 최초 제출 시각. 미제출 상태이면 null이다.
      oneOf: [{ $ref: './common.yaml#/LocalDateTime' }, { type: 'null' }]
    content: { type: [string, 'null'], example: 이번 주 과제를 완료했습니다. }
    link: { type: [string, 'null'], example: 'https://github.com/example/project' }
SubmissionSummary:
  type: object
  additionalProperties: false
  required: [id, name, profileImage, submissionStatus, createdAt]
  properties:
    id: { type: integer, format: int64, example: 1 }
    name: { type: string, example: 홍길동 }
    profileImage: { type: [string, 'null'], example: 'https://example.com/profile.png' }
    submissionStatus: { $ref: '#/SubmissionStatus' }
    createdAt: { $ref: './common.yaml#/LocalDateTime' }
SubmissionListResponse:
  type: object
  additionalProperties: false
  required: [submissions]
  properties:
    submissions: { type: array, items: { $ref: '#/SubmissionSummary' } }

SubmissionStatus:
  type: string
  enum: [NOT_ASSIGNED, NOT_SUBMITTED, SUBMITTED, LATE_SUBMITTED, MISSING]
  description: |
    NOT_ASSIGNED는 제출 대상이 아닌 경우다.
    제출 대상이면서 최초 제출 시각이 없으면 현재 시각이 마감 시각 이하일 때 NOT_SUBMITTED, 마감 시각을 지나면 MISSING이다.
    최초 제출 시각이 마감 시각 이하이면 SUBMITTED, 마감 시각을 지나면 LATE_SUBMITTED이다.
    재제출·내용 수정은 최초 제출 시각을 바꾸지 않는다. 마감 시각이 수정되면 변경된 마감 시각을 기준으로 상태를 다시 판정한다.

CompleteMember:
  type: object
  additionalProperties: false
  required: [id, name, profileImage, submittedAt]
  properties:
    id: { type: integer, format: int64, example: 1 }
    name: { type: string, example: 홍길동 }
    profileImage: { type: [string, 'null'], example: 'https://example.com/profile.png' }
    submittedAt:
      description: 최초 과제 제출 시각. 제출 내용을 수정해도 유지된다.
      $ref: './common.yaml#/LocalDateTime'
