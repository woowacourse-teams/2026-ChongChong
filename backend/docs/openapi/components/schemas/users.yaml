UserProfileNameUpdateRequest:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      description: 변경할 홈 프로필 이름. 공백만 있는 값은 허용하지 않는다.
      type: string
      minLength: 1
      maxLength: 8
      example: 바니
UserProfileImageUpdateRequest:
  type: object
  additionalProperties: false
  required: [fileId]
  properties:
    fileId:
      description: 업로드 완료 API에 성공한 본인 소유 파일의 ID. 현재 홈 프로필 파일이거나 다른 용도에 미연결인 파일이어야 한다.
      type: integer
      format: int64
      minimum: 1
      example: 123
UserProfileResponse:
  type: object
  additionalProperties: false
  required: [name, profileImageUrl]
  properties:
    name:
      description: 홈 마이페이지에 표시할 사용자 이름.
      type: string
      minLength: 1
      maxLength: 255
      example: 바니
    profileImageUrl:
      $ref: './common.yaml#/ProfileImageUrl'
      description: |
        홈 이미지 조회 URL. 업로드 파일이 있으면 presigned GET URL, 그렇지 않으면 기존 소셜 이미지 등 외부 URL을 반환한다.
        기본 이미지로 초기화한 경우 키를 포함해 null을 반환한다. 업로드 이미지 URL은 만료 시 내 프로필을 재조회해 갱신한다.
