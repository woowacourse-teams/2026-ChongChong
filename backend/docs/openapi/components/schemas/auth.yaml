SocialLoginRequest:
  type: object
  additionalProperties: false
  required: [provider, authorizationCode]
  properties:
    provider: { description: "로그인에 사용할 소셜 인증 제공자.", type: string, enum: [GOOGLE, KAKAO, APPLE], example: KAKAO }
    authorizationCode: { description: "소셜 로그인 성공 후 제공자로부터 받은 일회용 인가 코드. 액세스 토큰이 아니다.", type: string, minLength: 1, example: authorization-code-from-provider }
SocialLoginResponse:
  type: object
  additionalProperties: false
  required: [tokenType, accessToken, accessTokenExpiresAt]
  properties:
    tokenType: { type: string, const: Bearer }
    accessToken: { type: string, minLength: 1, example: eyJhbGciOiJIUzI1NiJ9... }
    accessTokenExpiresAt: { type: string, format: date-time, example: '2026-08-27T12:00:00Z' }
WebCsrfTokenResponse:
  type: object
  additionalProperties: false
  required: [headerName, token]
  properties:
    headerName: { type: string, const: X-XSRF-TOKEN }
    token: { type: string, minLength: 1, example: csrf-token }
