AssignmentRecurrenceCreateRequest:
  type: object
  additionalProperties: false
  required: [title, content, submissionVisibility, closeAt, intervalWeeks]
  oneOf:
    - required: [submissionTarget]
      additionalProperties: true
      properties:
        submissionTarget: { type: string }
    - required: [submitterIds]
      additionalProperties: true
      properties:
        submitterIds: { type: array }
  properties:
    title: { description: "빈 문자열이나 공백만 있는 값은 허용하지 않는다. 모든 회차에 같은 제목을 사용한다.", type: string, minLength: 1, maxLength: 100, example: 알고리즘 풀이 }
    content: { description: "빈 문자열이나 공백만 있는 값은 허용하지 않는다. 모든 회차에 같은 본문을 사용한다.", type: string, minLength: 1, maxLength: 10000, example: 이번 주 문제를 풀고 링크를 제출해주세요. }
    submissionMethod: { description: "선택 입력인 제출 방법 안내문. 생략, null, 빈 문자열 또는 공백만 입력하면 빈 문자열로 저장한다.", type: [string, 'null'], maxLength: 10000, example: 링크 제출 }
    submissionVisibility:
      type: string
      enum: [LEADER_ONLY, ALL_STUDY_MEMBERS]
      description: 모든 회차의 제출물 공개 범위. 의미는 과제 생성과 같다.
    submissionTarget:
      type: string
      enum: [MEMBERS_ONLY, MEMBERS_AND_LEADER]
      description: 범위 지정. 회차를 만들 때마다 그 시점의 스터디 멤버로 제출 대상을 정하므로 이후 가입한 멤버도 포함된다. submitterIds와 함께 보낼 수 없다.
    submitterIds:
      type: array
      description: 직접 선택한 스터디 멤버 ID 목록. 이후 가입한 멤버는 포함되지 않고, 스터디를 떠난 멤버는 자동으로 빠진다. submissionTarget과 함께 보낼 수 없다.
      minItems: 1
      uniqueItems: true
      items: { type: integer, format: int64, minimum: 1 }
    closeAt: { description: "첫 회차의 마감 시각. 서버의 현재 시각보다 미래여야 한다. 이 시각의 요일과 시각이 반복 마감 일정이 된다.", $ref: './common.yaml#/LocalDateTime' }
    intervalWeeks: { description: "반복 간격(주). 1은 매주, 2는 격주다.", type: integer, minimum: 1, maximum: 4, example: 1 }
    remindAts:
      description: 첫 회차 기준 리마인드 시각 목록. 서버의 현재 시각보다 미래이고 closeAt보다 앞서야 하며, closeAt과의 차이가 반복 간격보다 짧아야 한다. 서버는 각 시각을 "마감 N분 전"으로 바꿔 이후 회차에도 적용한다. 생략하거나 null이면 리마인드를 예약하지 않는다.
      type: [array, 'null']
      items: { $ref: './common.yaml#/LocalDateTime' }
AssignmentRecurrenceCreateResponse:
  type: object
  additionalProperties: false
  required: [recurrenceId, assignmentId]
  properties:
    recurrenceId: { type: integer, format: int64, example: 1 }
    assignmentId: { description: 함께 생성한 첫 회차 과제 ID, type: integer, format: int64, example: 10 }
AssignmentRecurrenceUpdateRequest:
  type: object
  additionalProperties: false
  description: 변경할 필드만 보낸다. 이미 생성된 회차는 바꾸지 않고 이후 생성되는 회차부터 적용한다.
  dependentRequired:
    intervalWeeks: [nextCloseAt]
  properties:
    title: { description: "생략하거나 null이면 기존 값을 유지한다.", type: [string, 'null'], minLength: 1, maxLength: 100, example: 알고리즘 풀이 }
    content: { description: "생략하거나 null이면 기존 값을 유지한다.", type: [string, 'null'], minLength: 1, maxLength: 10000, example: 이번 주 문제를 풀고 링크를 제출해주세요. }
    submissionMethod: { description: "생략하거나 null이면 기존 값을 유지하고, 빈 문자열이나 공백만 보내면 설명을 비운다.", type: [string, 'null'], maxLength: 10000, example: 링크 제출 }
    submissionVisibility:
      type: [string, 'null']
      enum: [LEADER_ONLY, ALL_STUDY_MEMBERS, null]
      description: 생략하거나 null이면 기존 값을 유지한다.
    submissionTarget:
      type: [string, 'null']
      enum: [MEMBERS_ONLY, MEMBERS_AND_LEADER, null]
      description: 보내면 범위 지정으로 바꾼다. submitterIds와 함께 보낼 수 없다.
    submitterIds:
      type: [array, 'null']
      description: 보내면 직접 선택으로 바꾸고 목록 전체를 교체한다. submissionTarget과 함께 보낼 수 없다.
      minItems: 1
      uniqueItems: true
      items: { type: integer, format: int64, minimum: 1 }
    nextCloseAt:
      description: 일정을 바꿀 때 다음에 생성할 회차의 마감 시각. 이 시각의 요일과 시각이 새 반복 일정이 되며, 현재 열린 회차의 규칙상 마감보다 뒤여야 한다. 다음 회차는 지금처럼 열린 회차가 마감될 때 생성된다.
      oneOf: [{ $ref: './common.yaml#/LocalDateTime' }, { type: 'null' }]
    intervalWeeks: { description: "반복 간격(주). 보내면 nextCloseAt도 함께 보내야 한다.", type: [integer, 'null'], minimum: 1, maximum: 4, example: 2 }
    remindAts:
      description: 다음에 생성할 회차 기준 리마인드 시각 목록. nextCloseAt을 보내면 그 마감을, 아니면 현재 다음 회차 마감을 기준으로 "마감 N분 전"으로 바꿔 저장한다. 생략하거나 null이면 유지하고 빈 배열이면 모두 제거한다.
      type: [array, 'null']
      items: { $ref: './common.yaml#/LocalDateTime' }
AssignmentRecurrenceListResponse:
  type: object
  additionalProperties: false
  required: [recurrences]
  properties:
    recurrences:
      type: array
      description: 스터디의 반복 과제 전체. 등록한 순서로 정렬하며 페이지네이션하지 않는다.
      items: { $ref: '#/AssignmentRecurrenceResponse' }
AssignmentRecurrenceResponse:
  type: object
  additionalProperties: false
  required: [id, title, content, submissionMethod, submissionVisibility, submissionTarget, submitterIds, intervalWeeks, dayOfWeek, closeTime, nextCloseAt, remindAts]
  properties:
    id: { type: integer, format: int64, example: 1 }
    title: { type: string, example: 알고리즘 풀이 }
    content: { type: string, example: 이번 주 문제를 풀고 링크를 제출해주세요. }
    submissionMethod: { type: string, example: 링크 제출 }
    submissionVisibility: { type: string, enum: [LEADER_ONLY, ALL_STUDY_MEMBERS] }
    submissionTarget:
      type: [string, 'null']
      enum: [MEMBERS_ONLY, MEMBERS_AND_LEADER, null]
      description: 범위 지정이면 값이 있고, 직접 선택이면 null이다.
    submitterIds:
      type: array
      description: 직접 선택한 멤버 ID 목록. 범위 지정이면 빈 배열이다.
      items: { type: integer, format: int64, minimum: 1 }
    intervalWeeks: { type: integer, minimum: 1, maximum: 4, example: 1 }
    dayOfWeek: { description: 마감 요일, type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY], example: TUESDAY }
    closeTime: { description: "마감 시각(서버 기준 로컬 시각).", type: string, pattern: '^\d{2}:\d{2}:\d{2}$', example: '23:59:00' }
    nextCloseAt: { description: "다음에 생성할 회차의 마감 시각. 현재 열린 회차가 아니다.", $ref: './common.yaml#/LocalDateTime' }
    remindAts:
      type: array
      description: 다음에 생성할 회차 기준 리마인드 시각 목록. 수정 화면의 초기값으로 그대로 사용할 수 있다.
      items: { $ref: './common.yaml#/LocalDateTime' }
