CommentWriteRequest:
  type: object
  additionalProperties: false
  required: [content]
  properties:
    content:
      type: string
      minLength: 1
      description: |
        필수 본문. 서버가 Unicode White_Space에 해당하는 앞뒤 공백을 제거한 뒤
        Unicode 코드 포인트 1~1,000자로 검증한다. 공백만 있는 본문은 거부하며 내부 공백·줄바꿈은 유지한다.
        정규화 전 입력에는 maxLength를 적용하지 않는다. 수정에서도 생략·null은 허용하지 않는다.
      example: "  일정 확인했습니다.\n다음 시간에 뵐게요.  "
CommentCreateResponse:
  type: object
  additionalProperties: false
  required: [commentId]
  properties:
    commentId: { type: integer, format: int64, minimum: 1, example: 42 }
CommentAuthorResponse:
  type: object
  additionalProperties: false
  required: [name, profileImageUrl, isDeparted]
  properties:
    name:
      type: string
      description: 현재 스터디 멤버 이름. 스터디 탈퇴·방출 또는 회원 탈퇴한 작성자는 탈퇴한 스터디원으로 표시한다.
      example: 바니
    profileImageUrl:
      type: [string, 'null']
      description: null이면 기본 이미지. 탈퇴한 작성자는 항상 null이다.
      example: null
    isDeparted: { type: boolean, description: 작성 당시 멤버십이 삭제됐는지 여부. 재가입으로 복원하지 않는다., example: false }
CommentResponse:
  type: object
  additionalProperties: false
  required: [id, author, createdAt, content, isEdited, canEdit, canDelete]
  properties:
    id: { type: integer, format: int64, minimum: 1, example: 42 }
    author: { $ref: '#/CommentAuthorResponse' }
    createdAt: { $ref: './common.yaml#/LocalDateTime' }
    content:
      type: string
      minLength: 1
      maxLength: 1000
      description: 앞뒤 공백을 제거하고 저장한 본문. 내부 공백·줄바꿈은 유지한다.
      example: "일정 확인했습니다.\n다음 시간에 뵐게요."
    isEdited: { type: boolean, description: 본문을 실제로 수정한 경우 true. 작성자 연결 해제로 바뀌지 않는다., example: false }
    canEdit: { type: boolean, description: 현재 사용자가 작성자 본인인지 여부. 서버는 수정 요청에서 다시 검증한다., example: true }
    canDelete: { type: boolean, description: 현재 사용자가 작성자 본인이거나 해당 스터디의 현재 리더인지 여부., example: true }
CommentCursor:
  type: string
  minLength: 1
  maxLength: 512
  pattern: '^[A-Za-z0-9_-]+$'
  description: |
    서버가 발급하는 Base64URL cursor. 원문 종류·ID와 작성 시각·댓글 ID를 포함하며 해당 원문에서만 사용한다.
    cursor 댓글이 삭제되어도 다음 페이지 조회는 가능하다. 접근 권한을 부여하는 토큰이 아니다.
CommentListResponse:
  type: object
  additionalProperties: false
  required: [comments, nextCursor, hasNext]
  properties:
    comments:
      type: array
      maxItems: 100
      description: 작성 시각 오름차순, 같은 시각이면 ID 오름차순. 수정해도 순서는 유지한다.
      items: { $ref: '#/CommentResponse' }
    nextCursor:
      description: hasNext가 false면 null. 다음 요청의 cursor로 그대로 전달한다.
      oneOf: [{ $ref: '#/CommentCursor' }, { type: 'null' }]
    hasNext: { type: boolean, example: false }
CommentInvalidContentError:
  allOf:
    - { $ref: './errors.yaml#/ErrorResponseBase' }
    - properties:
        code: { const: COMMENT_INVALID_CONTENT }
        message: { const: 댓글은 앞뒤 공백을 제거한 뒤 1자 이상 1000자 이하여야 합니다. }
CommentInvalidCursorError:
  allOf:
    - { $ref: './errors.yaml#/ErrorResponseBase' }
    - properties:
        code: { const: COMMENT_INVALID_CURSOR }
        message: { const: 댓글 조회 커서가 올바르지 않습니다. }
CommentInvalidPageRequestError:
  allOf:
    - { $ref: './errors.yaml#/ErrorResponseBase' }
    - properties:
        code: { const: COMMENT_INVALID_PAGE_REQUEST }
        message: { const: cursor와 focusCommentId는 함께 지정할 수 없습니다. }
CommentNotFoundError:
  allOf:
    - { $ref: './errors.yaml#/ErrorResponseBase' }
    - properties:
        code: { const: COMMENT_NOT_FOUND }
        message: { const: 해당 원문의 댓글을 찾을 수 없습니다. }
CommentTargetNotReadyError:
  allOf:
    - { $ref: './errors.yaml#/ErrorResponseBase' }
    - properties:
        code: { const: COMMENT_TARGET_NOT_READY }
        message: { const: 실제 제출이 완료된 후 댓글을 작성할 수 있습니다. }
CommentStateChangedError:
  allOf:
    - { $ref: './errors.yaml#/ErrorResponseBase' }
    - properties:
        code: { const: COMMENT_STATE_CHANGED }
        message: { const: 댓글 대상이나 참여 상태가 변경되었습니다. 다시 시도해 주세요. }
