NoticeCreateRequest:
  type: object
  additionalProperties: false
  required: [title, content]
  properties:
    title: { description: "빈 문자열이나 공백만 있는 값은 허용하지 않는다. 공지 제목.", type: string, minLength: 1, maxLength: 100, example: 이번 주 공지 }
    content: { description: "빈 문자열이나 공백만 있는 값은 허용하지 않는다. 공지 본문. 스터디원에게 전달할 안내를 작성한다.", type: string, minLength: 1, maxLength: 10000, example: 이번 주 스터디 일정을 확인해주세요. }
    remindAts:
      description: "리마인드 알림을 보낼 시각 목록. 생략하거나 null이면 알림을 예약하지 않는다. 시각은 서버의 현재 시각보다 미래여야 한다."
      type: [array, 'null']
      items: { $ref: './common.yaml#/LocalDateTime' }
    attachmentFileIds:
      description: |
        첨부 식별자의 표시 순서 목록. 생략·null·빈 배열은 첨부 없음. 중복 불가.
        업로드 완료 API에 성공한 COMPLETED 상태·본인 소유·공지/과제/제출물에 미연결인 파일만 허용한다.
        기본 최대 10장·장당 5MiB·JPEG/PNG/WebP이며 빈 파일은 거부한다. 형식·용량·개수는 설정 가능하며
        공통 업로드 용량 제한도 함께 적용된다.
      type: [array, 'null']
      uniqueItems: true
      items: { type: integer, format: int64, minimum: 1 }
NoticeUpdateRequest:
  type: object
  additionalProperties: false
  properties:
    title: { description: "빈 문자열이나 공백만 있는 값은 허용하지 않는다. 공지 제목. 생략하거나 null이면 기존 값을 유지한다.", type: [string, 'null'], minLength: 1, maxLength: 100, example: 수정된 공지 }
    content: { description: "빈 문자열이나 공백만 있는 값은 허용하지 않는다. 공지 본문. 스터디원에게 전달할 안내를 작성한다. 생략하거나 null이면 기존 값을 유지한다.", type: [string, 'null'], minLength: 1, maxLength: 10000, example: 수정된 공지 내용입니다. }
    remindAts:
      description: "리마인드 알림을 보낼 시각 목록. 생략하거나 null이면 기존 예약을 유지하고 빈 배열이면 대기 중인 예약을 제거한다. 시각은 서버의 현재 시각보다 미래여야 한다."
      type: [array, 'null']
      items: { $ref: './common.yaml#/LocalDateTime' }
    attachmentFileIds:
      description: |
        최종 첨부 목록과 표시 순서. 생략·null은 유지, 빈 배열은 전체 제거. 중복 불가.
        새 파일은 업로드 완료 API에 성공한 COMPLETED 상태·본인 소유·공지/과제/제출물에 미연결이어야 한다.
        기본 최대 10장·장당 5MiB·JPEG/PNG/WebP이며 빈 파일은 거부한다. 형식·용량·개수는 설정 가능하며
        공통 업로드 용량 제한도 함께 적용된다. 최종 개수는 전체 목록, 소유권·형식·크기는 새 파일에 적용한다.
        이전 리더 소유의 기존 첨부도 유지·재정렬할 수 있다.
        제거 파일은 연결만 해제하고 COMPLETED를 유지하며 미연결 상태에서 소유자가 다시 첨부할 수 있다.
      type: [array, 'null']
      uniqueItems: true
      items: { type: integer, format: int64, minimum: 1 }
NoticeCreateResponse:
  type: object
  additionalProperties: false
  required: [noticeId]
  properties:
    noticeId: { type: integer, format: int64, example: 1 }
NoticeDetailResponse:
  type: object
  additionalProperties: false
  required: [id, title, content, createdAt, attachments]
  properties:
    id: { type: integer, format: int64, example: 1 }
    title: { type: string, example: 이번 주 공지 }
    content: { type: string, example: 이번 주 스터디 일정을 확인해주세요. }
    createdAt: { $ref: './common.yaml#/LocalDateTime' }
    attachments:
      description: 표시 순서대로 정렬한 첨부 메타데이터. 무첨부는 빈 배열. object key·업로드 URL은 제외하며 파일 접근 URL은 후속 계약이다.
      type: array
      items: { $ref: '#/NoticeAttachmentResponse' }
NoticeAttachmentResponse:
  type: object
  additionalProperties: false
  required: [fileId, originalFileName, contentType, size, sortOrder]
  properties:
    fileId: { type: integer, format: int64, minimum: 1 }
    originalFileName: { type: string }
    contentType: { type: string }
    size: { type: integer, format: int64, minimum: 1, description: 파일 크기(바이트) }
    sortOrder: { type: integer, minimum: 0, description: 0부터 시작하는 표시 순서 }
NoticeSummaryResponse:
  type: object
  additionalProperties: false
  required: [id, title, content, createdAt]
  oneOf:
    - required: [isComplete]
    - required: [readStatus]
  properties:
    id: { type: integer, format: int64, example: 1 }
    title: { type: string, example: 이번 주 공지 }
    content: { type: string, example: 이번 주 스터디 일정을 확인해주세요. }
    createdAt: { $ref: './common.yaml#/LocalDateTime' }
    recipientCount: { type: integer, example: 5 }
    readRecipientCount: { type: integer, example: 3 }
    remindAt:
      description: 대기 중인 리마인더의 가장 이른 예약 시각. 예약이 없으면 목록에서는 생략하고 현황 응답에서는 null을 반환한다.
      $ref: './common.yaml#/LocalDateTime'
    isComplete: { type: boolean, description: 리더에게 반환하는 전체 읽음 완료 여부, example: false }
    readStatus: { $ref: '#/NoticeReadStatus' }
NoticeListResponse:
  type: object
  additionalProperties: false
  required: [nextCursor, hasNext, notices]
  properties:
    nextCursor: { type: [integer, 'null'], format: int64, example: 10 }
    hasNext: { type: boolean, example: false }
    notices: { type: array, items: { $ref: '#/NoticeSummaryResponse' } }
MemberBase:
  type: object
  additionalProperties: false
  required: [id, name, profileImage]
  properties:
    id: { type: integer, format: int64, example: 1 }
    name: { type: string, example: 홍길동 }
    profileImage: { type: [string, 'null'], example: 'https://example.com/profile.png' }
UnreadMember:
  type: object
  additionalProperties: false
  required: [id, name, profileImage, lastRemindAt]
  properties:
    id: { type: integer, format: int64, example: 2 }
    name: { type: string, example: 김철수 }
    profileImage: { type: [string, 'null'], example: 'https://example.com/profile.png' }
    lastRemindAt:
      oneOf: [{ $ref: './common.yaml#/LocalDateTime' }, { type: 'null' }]
NoticeStatusesResponse:
  type: object
  additionalProperties: false
  required: [id, memberCount, readCount, unreadCount, remindAt, readMembers, unreadMembers]
  properties:
    id: { type: integer, format: int64, example: 1 }
    memberCount: { type: integer, example: 5 }
    readCount: { type: integer, example: 3 }
    unreadCount: { type: integer, example: 2 }
    remindAt:
      description: 대기 중인 리마인더의 가장 이른 예약 시각. 예약이 없으면 목록에서는 생략하고 현황 응답에서는 null을 반환한다.
      oneOf: [{ $ref: './common.yaml#/LocalDateTime' }, { type: 'null' }]
    readMembers: { type: array, items: { $ref: '#/ReadMember' } }
    unreadMembers: { type: array, items: { $ref: '#/UnreadMember' } }
NoticeReadResponse:
  type: object
  additionalProperties: false
  required: [readAt]
  properties:
    readAt: { $ref: './common.yaml#/LocalDateTime' }
NoticeReadStatusResponse:
  type: object
  additionalProperties: false
  required: [readStatus]
  properties:
    readStatus: { $ref: '#/NoticeReadStatus' }
    readAt:
      $ref: './common.yaml#/LocalDateTime'

NoticeReadStatus:
  type: string
  enum: [NOT_ASSIGNED, UNREAD, READ]
  description: 확인 대상 아님, 읽지 않음, 읽음을 구분하는 본인의 상태

ReadMember:
  type: object
  additionalProperties: false
  required: [id, name, profileImage, readAt]
  properties:
    id: { type: integer, format: int64, example: 1 }
    name: { type: string, example: 홍길동 }
    profileImage: { type: [string, 'null'], example: 'https://example.com/profile.png' }
    readAt:
      description: 최초 공지 읽음 시각
      $ref: './common.yaml#/LocalDateTime'
