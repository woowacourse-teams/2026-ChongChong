FieldErrorDetail:
  type: object
  additionalProperties: false
  required: [code, field, reason]
  properties:
    code: { type: string, example: REQUEST_VALIDATION_NOT_BLANK }
    field: { type: string, example: title }
    reason: { type: string, example: 제목은 필수 값입니다. }
ErrorResponseBase:
  type: object
  additionalProperties: false
  required: [code, message]
  properties:
    code: { type: string }
    message: { type: string }
ErrorResponse:
  type: object
  additionalProperties: false
  required: [code, message]
  properties:
    code:
      type: string
      enum:
        - INVALID_INPUT_VALUE
        - INVALID_REQUEST_PARAMETER
        - INVALID_REQUEST
        - AUTHENTICATION_REQUIRED
        - INVALID_REFRESH_TOKEN
        - SOCIAL_AUTHENTICATION_FAILED
        - UNSUPPORTED_SOCIAL_PROVIDER
        - INVALID_CSRF_TOKEN
        - ACCESS_DENIED
        - STUDY_ACCESS_DENIED
        - NOT_STUDY_LEADER
        - INVALID_INVITE_TOKEN
        - STUDY_LEADER_CANNOT_BE_REMOVED
        - STUDY_LEADER_CANNOT_LEAVE
        - STUDY_NOT_FOUND
        - STUDY_MEMBER_NOT_FOUND
        - USER_NOT_FOUND
        - NOTICE_NOT_FOUND
        - NOTICE_RECIPIENT_NOT_FOUND
        - ASSIGNMENT_NOT_FOUND
        - ASSIGNMENT_SUBMISSION_NOT_FOUND
        - INVALID_TITLE
        - INVALID_CONTENT
        - INVALID_LINK
        - INVALID_SUBMISSION_METHOD
        - INVALID_CLOSE_AT
        - INVALID_REMIND_AT
        - JOINED_STUDY_LIMIT_EXCEEDED
        - ALREADY_JOINED_STUDY
        - STUDY_MEMBER_LIMIT_EXCEEDED
    message: { type: string }
InvalidInputValueError:
  type: object
  additionalProperties: false
  required: [code, message, errors]
  properties:
    code: { type: string, const: INVALID_INPUT_VALUE }
    message: { type: string, const: 입력값이 올바르지 않습니다. }
    errors:
      type: array
      minItems: 1
      items: { $ref: '#/FieldErrorDetail' }
  examples: [{ code: INVALID_INPUT_VALUE, message: 입력값이 올바르지 않습니다., errors: [{ code: REQUEST_VALIDATION_NOT_BLANK, field: title, reason: 제목은 필수 값입니다. }] }]
InvalidRequestParameterError:
  type: object
  additionalProperties: false
  required: [code, message, errors]
  properties:
    code: { type: string, const: INVALID_REQUEST_PARAMETER }
    message: { type: string, const: 요청 파라미터가 올바르지 않습니다. }
    errors:
      type: array
      minItems: 1
      items: { $ref: '#/FieldErrorDetail' }
  examples: [{ code: INVALID_REQUEST_PARAMETER, message: 요청 파라미터가 올바르지 않습니다., errors: [{ code: REQUEST_VALIDATION_POSITIVE, field: studyId, reason: 스터디 ID는 양수여야 합니다. }] }]
InvalidRequestError: { allOf: [{ $ref: '#/ErrorResponseBase' }, { properties: { code: { const: INVALID_REQUEST }, message: { const: 요청 형식이 잘못되었습니다. } } }], examples: [{ code: INVALID_REQUEST, message: 요청 형식이 잘못되었습니다. }] }
AuthenticationRequiredError: { allOf: [{ $ref: '#/ErrorResponseBase' }, { properties: { code: { const: AUTHENTICATION_REQUIRED }, message: { const: 인증이 필요합니다. } } }], examples: [{ code: AUTHENTICATION_REQUIRED, message: 인증이 필요합니다. }] }
