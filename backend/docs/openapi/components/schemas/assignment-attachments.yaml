AttachmentFileIds:
  type: [array, 'null']
  uniqueItems: true
  maxItems: 10
  items: { type: integer, format: int64, minimum: 1 }
  description: 완료된 본인 파일 ID 목록. 생략 또는 null이면 기존 첨부 유지, 빈 배열이면 제거한다. 배열 순서로 표시하며 다른 게시물의 파일은 재사용할 수 없다.
Attachment:
  type: object
  additionalProperties: false
  required: [fileId, originalFileName, contentType, size, sortOrder]
  properties:
    fileId: { type: integer, format: int64 }
    originalFileName: { type: string }
    contentType: { type: string }
    size: { type: integer, format: int64, minimum: 0 }
    sortOrder: { type: integer, minimum: 0 }
AttachmentBadRequest:
  type: object
  required: [code, message]
  properties:
    code: { type: string, enum: [EMPTY_SUBMISSION, INVALID_ATTACHMENT_IDS, ATTACHMENT_LIMIT_EXCEEDED, INVALID_ATTACHMENT_TYPE, INVALID_ATTACHMENT_SIZE, FILE_NOT_ATTACHABLE] }
    message: { type: string }
