extensions:
  sigv4auth:
    service: aps
    region: ${env:AMP_AWS_REGION}

receivers:
  prometheus:
    config:
      global:
        scrape_interval: 60s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: chongchong-backend
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["backend:8080"]
              labels:
                environment: ${env:CLOUD_WATCH_APP_ENV}
                service: chongchong-backend

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    send_batch_size: 512
    timeout: 10s

exporters:
  prometheusremotewrite:
    endpoint: ${env:AMP_REMOTE_WRITE_URL}
    auth:
      authenticator: sigv4auth
    remote_write_queue:
      enabled: true
      queue_size: 256
      num_consumers: 1
    max_batch_request_parallelism: 1

service:
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
