name: Branch policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore:
      - main
      - dev
      - prod

permissions:
  contents: read

jobs:
  validate:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Test branch policy
        run: .github/scripts/validate-branch-policy-test.sh

      - name: Validate branch name and pull request target
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: .github/scripts/validate-branch-policy.sh "$HEAD_BRANCH" "$BASE_BRANCH"
