name: Deployment configuration CI
on:
  pull_request:
    paths: ['deploy/**', '.github/workflows/deploy-ci.yml']
  push:
    branches: [dev, prod, main]
    paths: ['deploy/**', '.github/workflows/deploy-ci.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: for script in deploy/scripts/*.sh deploy/tests/nginx-smoke.sh; do bash -n "$script" || exit 1; done
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
      - run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config --quiet
      - run: bash deploy/tests/nginx-smoke.sh
