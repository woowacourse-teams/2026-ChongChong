name: Backend CI

on:
  push:
    branches: [ main, dev, prod ]
  pull_request:
    branches: [ main, dev, prod ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-documentation:
    name: API documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/docs/openapi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/docs/openapi/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Test static document rendering
        run: npm test
      - name: Lint OpenAPI specification
        run: npm run lint
      - name: Bundle OpenAPI specification
        run: npm run bundle
      - name: Build static API documentation
        run: npm run build

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Check Docker
        run: docker info
      - name: Test and build executable JAR
        run: ./gradlew test bootJar
